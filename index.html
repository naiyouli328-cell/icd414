<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ICD 刷题系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #4361ee;
    --primary-hover: #3a56d4;
    --primary-light: #eef0ff;
    --success: #10b981;
    --success-bg: #ecfdf5;
    --success-border: #a7f3d0;
    --error: #ef4444;
    --error-bg: #fef2f2;
    --error-border: #fecaca;
    --warning: #f59e0b;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --text2: #475569;
    --text3: #94a3b8;
    --border: #e2e8f0;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== Header ===== */
  .header {
    background: linear-gradient(135deg, #4361ee, #3a0ca3);
    color: #fff;
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(67,97,238,0.3);
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
  .header .subtitle { font-size: 12px; opacity: 0.8; margin-top: 2px; }

  .mode-toggle {
    display: flex;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 3px;
  }
  .mode-btn {
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .mode-btn.active { background: #fff; color: var(--primary); }

  /* ===== Stats Bar ===== */
  .stats-bar {
    padding: 10px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text2);
    gap: 12px;
    flex-wrap: wrap;
  }
  .stats-bar .stat { display: flex; align-items: center; gap: 4px; }
  .stats-bar .stat-num { font-weight: 700; color: var(--text); }
  .stats-bar .stat.ok { color: var(--success); }
  .stats-bar .stat.err { color: var(--error); }

  /* ===== Filter Bar ===== */
  .filter-bar {
    display: flex;
    gap: 6px;
    padding: 12px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    position: sticky;
    top: 60px;
    z-index: 99;
  }
  .filter-bar::-webkit-scrollbar { height: 0; }
  .filter-btn {
    flex-shrink: 0;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--card);
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    font-family: inherit;
    font-weight: 500;
  }
  .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .filter-btn .cnt {
    display: inline-block;
    background: rgba(0,0,0,0.06);
    border-radius: 8px;
    padding: 0 6px;
    margin-left: 3px;
    font-size: 11px;
  }
  .filter-btn.active .cnt { background: rgba(255,255,255,0.2); }
  .filter-btn.wrong-filter { border-color: var(--error); color: var(--error); }
  .filter-btn.wrong-filter.active { background: var(--error); color: #fff; border-color: var(--error); }
  .filter-btn.wrong-filter .cnt { background: rgba(239,68,68,0.1); }
  .filter-btn.wrong-filter.active .cnt { background: rgba(255,255,255,0.2); }

  /* ===== Question List (Practice) ===== */
  .q-list { max-width: 720px; margin: 0 auto; padding: 12px 12px 80px; }
  .q-list .empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 14px; }

  .q-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    padding: 20px;
    border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .q-card:hover { box-shadow: var(--shadow-md); }
  .q-card.is-wrong { border-left: 3px solid var(--error); }
  .q-card.is-correct { border-left: 3px solid var(--success); }

  .q-hd {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .q-hd .id { font-size: 12px; color: var(--text3); font-weight: 600; }
  .q-hd .badge {
    font-size: 11px; padding: 2px 10px; border-radius: 8px;
    background: var(--primary-light); color: var(--primary); font-weight: 600;
  }
  .q-hd .wrong-tag {
    margin-left: auto; font-size: 11px; padding: 2px 10px; border-radius: 8px;
    background: var(--error-bg); color: var(--error); font-weight: 600;
  }

  .q-text {
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 16px;
    color: var(--text);
  }
  .q-text .blank {
    display: inline-block;
    width: 120px; margin: 0 3px; padding: 2px 8px;
    border: none; border-bottom: 2px solid var(--primary);
    background: #f8f9ff; font-size: 14px; color: var(--text);
    outline: none; font-family: inherit;
    transition: border-color 0.2s;
  }
  .q-text .blank:focus { border-bottom-color: var(--primary-hover); }
  .q-text .blank.correct { border-bottom-color: var(--success); }
  .q-text .blank.wrong { border-bottom-color: var(--error); }

  /* ===== Options ===== */
  .opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .opt {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
    user-select: none;
  }
  .opt:hover { border-color: var(--primary); background: #fafbff; }
  .opt.sel { border-color: var(--primary); background: var(--primary-light); }
  .opt.correct { border-color: var(--success) !important; background: var(--success-bg) !important; }
  .opt.wrong { border-color: var(--error) !important; background: var(--error-bg) !important; }
  .opt .letter {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: var(--text2); flex-shrink: 0;
    transition: all 0.15s;
  }
  .opt.sel .letter { background: var(--primary); color: #fff; }
  .opt.correct .letter { background: var(--success) !important; color: #fff !important; }
  .opt.wrong .letter { background: var(--error) !important; color: #fff !important; }

  /* Judge */
  .judge-group { display: flex; gap: 12px; margin-bottom: 12px; }
  .judge-btn {
    flex: 1; padding: 12px; border: 1.5px solid var(--border);
    border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 600;
    transition: all 0.15s; background: var(--card); font-family: inherit;
  }
  .judge-btn:hover { border-color: var(--primary); }
  .judge-btn.sel-true { border-color: var(--success); color: var(--success); background: var(--success-bg); }
  .judge-btn.sel-false { border-color: var(--error); color: var(--error); background: var(--error-bg); }

  /* Text input */
  .txt-inp {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 14px; font-family: inherit; outline: none;
    transition: border-color 0.2s; resize: vertical; min-height: 40px;
  }
  .txt-inp:focus { border-color: var(--primary); }

  /* ===== Feedback ===== */
  .fb {
    margin-top: 12px; padding: 12px 16px; border-radius: 10px;
    font-size: 14px; font-weight: 600; display: none;
    display: none; align-items: center; gap: 8px;
  }
  .fb.show { display: flex; }
  .fb.correct { background: var(--success-bg); color: #065f46; border: 1px solid var(--success-border); }
  .fb.wrong { background: var(--error-bg); color: #991b1b; border: 1px solid var(--error-border); }
  .fb.info { background: var(--primary-light); color: var(--primary); border: 1px solid #c7d2fe; }
  .fb .icon { font-size: 18px; }

  /* ===== Actions ===== */
  .q-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    padding: 8px 20px; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-pri { background: var(--primary); color: #fff; }
  .btn-pri:hover { background: var(--primary-hover); }
  .btn-out {
    background: transparent; border: 1px solid var(--border); color: var(--text2);
  }
  .btn-out:hover { border-color: var(--primary); color: var(--primary); }
  .btn-del { background: transparent; border: 1px solid var(--error); color: var(--error); }
  .btn-del:hover { background: var(--error-bg); }
  .btn-suc { background: var(--success); color: #fff; }
  .btn-suc:hover { opacity: 0.9; }

  /* ===== Answer Reveal ===== */
  .reveal {
    margin-top: 12px; padding: 14px; background: #f8fafc;
    border: 1px dashed var(--border); border-radius: 10px; display: none;
  }
  .reveal.show { display: block; }
  .reveal .rl { font-size: 12px; color: var(--text3); font-weight: 600; margin-bottom: 6px; }
  .reveal .rc { font-size: 14px; line-height: 1.7; color: var(--text); }
  .reveal .rc code {
    display: inline-block; background: var(--primary-light);
    color: var(--primary); padding: 2px 10px; border-radius: 4px; font-size: 14px;
  }
  .reveal .detail {
    margin-top: 10px; padding: 10px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; line-height: 1.6; white-space: pre-wrap; color: var(--text2);
  }

  /* =============================================
     EXAM MODE
     ============================================= */
  #exam-mode { display: none; }
  #exam-mode.active { display: block; }
  #practice-mode.active { display: block; }
  #practice-mode { display: none; }

  .exam-head {
    background: linear-gradient(135deg, #4361ee, #3a0ca3);
    color: #fff;
    padding: 12px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(67,97,238,0.3);
  }
  .exam-head-top { display: flex; align-items: center; justify-content: space-between; }
  .exam-head .title { font-size: 16px; font-weight: 700; }
  .exam-head .timer {
    font-size: 18px; font-weight: 700;
    background: rgba(255,255,255,0.15);
    padding: 4px 14px; border-radius: 8px;
    font-variant-numeric: tabular-nums;
  }
  .exam-head .timer.warn { color: #fbbf24; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.6; } }

  .exam-progress {
    padding: 10px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text2);
  }
  .exam-progress .bar-wrap {
    flex: 1; height: 6px; background: var(--bg);
    border-radius: 3px; overflow: hidden;
  }
  .exam-progress .bar-fill {
    height: 100%; background: var(--primary);
    border-radius: 3px; transition: width 0.3s;
  }
  .exam-progress .pstat { font-weight: 600; color: var(--text); white-space: nowrap; }

  /* Question palette */
  .exam-palette {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 10px 20px; background: var(--card);
    border-bottom: 1px solid var(--border);
    max-height: 120px; overflow-y: auto;
  }
  .palette-btn {
    width: 32px; height: 32px; border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card); color: var(--text2);
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; font-family: inherit;
  }
  .palette-btn:hover { border-color: var(--primary); }
  .palette-btn.current { border-color: var(--primary); background: var(--primary); color: #fff; }
  .palette-btn.answered { background: var(--success-bg); border-color: var(--success); color: var(--success); }
  .palette-btn.answered.current { background: var(--primary); color: #fff; border-color: var(--primary); }
  .palette-btn.wrong-ans { background: var(--error-bg); border-color: var(--error); color: var(--error); }

  /* Exam main */
  .exam-main {
    max-width: 720px; margin: 0 auto; padding: 16px 12px 100px;
  }
  .exam-main .q-card { margin-bottom: 0; }

  .exam-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    z-index: 100;
  }
  .exam-nav .nav-btn {
    padding: 10px 24px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card);
    color: var(--text2); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.15s; font-family: inherit;
  }
  .exam-nav .nav-btn:hover { border-color: var(--primary); color: var(--primary); }
  .exam-nav .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .exam-nav .nav-btn:disabled:hover { border-color: var(--border); color: var(--text2); }
  .exam-nav .nav-btn.pri { background: var(--primary); color: #fff; border-color: var(--primary); }
  .exam-nav .nav-btn.pri:hover { background: var(--primary-hover); }
  .exam-nav .nav-btn.danger { background: var(--error); color: #fff; border-color: var(--error); }
  .exam-nav .nav-btn.danger:hover { background: #dc2626; }

  /* ===== Results ===== */
  #exam-results { display: none; max-width: 720px; margin: 0 auto; padding: 24px 12px; }
  #exam-results.active { display: block; }

  .result-card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow-lg); padding: 32px 24px;
    text-align: center; border: 1px solid var(--border);
  }
  .result-card .big-score { font-size: 64px; font-weight: 800; color: var(--primary); line-height: 1; }
  .result-card .big-score.pass { color: var(--success); }
  .result-card .big-score.fail { color: var(--error); }
  .result-card .score-label { font-size: 14px; color: var(--text2); margin-top: 4px; }
  .result-card .score-detail {
    display: flex; justify-content: center; gap: 32px;
    margin-top: 20px; font-size: 14px;
  }
  .result-card .score-detail .s-item { text-align: center; }
  .result-card .score-detail .s-num { font-size: 24px; font-weight: 700; color: var(--text); }
  .result-card .score-detail .s-label { color: var(--text3); font-size: 12px; margin-top: 2px; }
  .result-card .result-actions { margin-top: 24px; display: flex; gap: 12px; justify-content: center; }

  /* Result review */
  .review-list { margin-top: 16px; }
  .review-item {
    background: var(--card); border-radius: var(--radius);
    padding: 16px 20px; margin-bottom: 10px;
    border: 1px solid var(--border); border-left: 3px solid var(--border);
  }
  .review-item.is-correct { border-left-color: var(--success); }
  .review-item.is-wrong { border-left-color: var(--error); }
  .review-item .ri-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .review-item .ri-hd .ri-icon { font-size: 16px; }
  .review-item .ri-hd .ri-id { font-size: 12px; color: var(--text3); }
  .review-item .ri-hd .ri-badge { font-size: 11px; padding: 1px 8px; border-radius: 6px; background: var(--primary-light); color: var(--primary); }
  .review-item .ri-q { font-size: 14px; line-height: 1.7; margin-bottom: 8px; }
  .review-item .ri-ans { font-size: 13px; color: var(--text2); }
  .review-item .ri-ans .ri-label { color: var(--text3); }
  .review-item .ri-ans .ri-correct { color: var(--success); font-weight: 600; }
  .review-item .ri-ans .ri-yours { color: var(--error); font-weight: 600; }

  /* ===== Exam Setup ===== */
  #exam-setup { display: none; max-width: 480px; margin: 0 auto; padding: 40px 16px; }
  #exam-setup.active { display: block; }
  .setup-card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow-md); padding: 32px 24px;
    text-align: center; border: 1px solid var(--border);
  }
  .setup-card h2 { font-size: 20px; margin-bottom: 8px; }
  .setup-card p { color: var(--text2); font-size: 14px; margin-bottom: 24px; }
  .setup-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 24px; }
  .setup-opt {
    padding: 16px 8px; border: 1.5px solid var(--border);
    border-radius: 10px; cursor: pointer; transition: all 0.15s;
    background: var(--card); font-family: inherit;
  }
  .setup-opt:hover { border-color: var(--primary); }
  .setup-opt.sel { border-color: var(--primary); background: var(--primary-light); }
  .setup-opt .so-num { font-size: 24px; font-weight: 700; color: var(--text); }
  .setup-opt .so-label { font-size: 12px; color: var(--text3); margin-top: 4px; }

  /* ===== Responsive ===== */
  @media (max-width: 600px) {
    .header { padding: 12px 16px; }
    .header h1 { font-size: 16px; }
    .stats-bar { padding: 8px 16px; font-size: 12px; }
    .filter-bar { padding: 8px 16px; top: 54px; }
    .q-list { padding: 8px 8px 70px; }
    .q-card { padding: 16px; }
    .q-text { font-size: 14px; }
    .exam-head { padding: 10px 16px; }
    .exam-head .title { font-size: 14px; }
    .exam-head .timer { font-size: 16px; }
    .exam-progress { padding: 8px 16px; }
    .exam-main { padding: 12px 8px 90px; }
    .exam-nav { padding: 8px 12px; }
    .exam-nav .nav-btn { padding: 8px 16px; font-size: 12px; }
    .exam-palette { padding: 8px 16px; max-height: 80px; }
    .result-card { padding: 24px 16px; }
    .result-card .big-score { font-size: 48px; }
    .setup-card { padding: 24px 16px; }
    .setup-options { grid-template-columns: 1fr 1fr; }
  }
  .resume-toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 999; opacity: 0; transition: opacity 0.3s, bottom 0.3s; box-shadow: var(--shadow-md); white-space: nowrap; pointer-events: none; }
  .resume-toast.show { opacity: 1; bottom: 70px; }
</style>
</head>
<body>

<!-- =============================================
     HEADER (Practice)
     ============================================= -->
<header class="header" id="practice-header">
  <div class="header-top">
    <div>
      <h1>ICD 刷题系统</h1>
      <div class="subtitle">疾病分类与代码  ·  共 <strong id="total-count"></strong> 题</div>
    </div>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="practice" onclick="switchMode('practice')">练习</button>
      <button class="mode-btn" data-mode="exam" onclick="switchMode('exam')">考试</button>
    </div>
  </div>
</header>

<!-- =============================================
     PRACTICE MODE
     ============================================= -->
<div id="practice-mode" class="active">
  <div class="stats-bar" id="stats-bar">
    <span id="stats-text">加载中...</span>
    <span id="wrong-stat" style="display:none" class="stat err">
      ✗ 错题 <span class="stat-num" id="wrong-count">0</span>
    </span>
  </div>
  <nav class="filter-bar" id="filter-bar"></nav>
  <main class="q-list" id="q-list"></main>
</div>

<!-- =============================================
     EXAM SETUP
     ============================================= -->
<div id="exam-setup">
  <div class="setup-card">
    <h2>📝 模拟考试</h2>
    <p>系统将从所有题目中随机抽取，混合出题</p>
    <div class="setup-options" id="exam-counts">
      <div class="setup-opt sel" data-n="20" onclick="selectExamCount(this,20)">
        <div class="so-num">20</div>
        <div class="so-label">快速练习</div>
      </div>
      <div class="setup-opt" data-n="50" onclick="selectExamCount(this,50)">
        <div class="so-num">50</div>
        <div class="so-label">标准考试</div>
      </div>
      <div class="setup-opt" data-n="100" onclick="selectExamCount(this,100)">
        <div class="so-num">100</div>
        <div class="so-label">完整测试</div>
      </div>
    </div>
    <button class="btn btn-pri" style="padding:12px 48px;font-size:15px" onclick="startExam()">开始考试</button>
  </div>
</div>

<!-- =============================================
     EXAM MODE
     ============================================= -->
<div id="exam-mode">
  <div class="exam-head">
    <div class="exam-head-top">
      <div class="title">📝 模拟考试</div>
      <div class="timer" id="exam-timer">00:00</div>
    </div>
  </div>
  <div class="exam-progress">

rs": ["不变", "/6"]}, {"id": "填空-45", "type": "填空题", "question": "ICD-10 规定急性心肌梗死以（____）为限，超过这一时间为慢性心肌梗死。", "answer": "28天/四周", "answers": ["28天/四周"]}, {"id": "填空-46", "type": "填空题", "question": "当呼吸系统炎症发生于一个以上的部位并且没有明确的索引指明其编码时，要按（____）部位分类。", "answer": "较低的解剖", "answers": ["较低的解剖"]}, {"id": "填空-47", "type": "填空题", "question": "ICD-10 中肾小球疾病N00-N07 的第四位数亚目.0-.8 必须通过（____）证实才可使用。", "answer": "病理检查", "answers": ["病理检查"]}, {"id": "填空-48", "type": "填空题", "question": "ICD-10 中O03-O06 的过时并发症的编码要使用（____）类目的编码。", "answer": "O08", "answers": ["O08"]}, {"id": "填空-49", "type": "填空题", "question": "除淋巴和血液以外的恶性肿瘤统称为（____），它包括（____）和（____）。", "answer": "癌瘤；上皮细胞癌；肉瘤", "answers": ["癌瘤", "上皮细胞癌", "肉瘤"]}, {"id": "填空-50", "type": "填空题", "question": "ICD-10 中C97 的部位编码是（____）的综合编码。", "answer": "复合癌", "answers": ["复合癌"]}, {"id": "填空-51", "type": "填空题", "question": "其他和未特指传染性病因的肠炎、胃肠炎原分类于（____）。新版ICD-10 将其分类于（____）。", "answer": "K52.9；A09", "answers": ["K52.9", "A09"]}, {"id": "填空-52", "type": "填空题", "question": "疾病分类轴心是分类的（____）,它取自于疾病的（____）。", "answer": "标准；某一种特征", "answers": ["标准", "某一种特征"]}, {"id": "填空-53", "type": "填空题", "question": "第十五章妊娠、分娩和产褥期是对其并发症的分类，从时间上可分为三个阶段，此章最佳主导词分别是（____）、（____）、（____）。", "answer": "妊娠；分娩；产褥期", "answers": ["妊娠", "分娩", "产褥期"]}, {"id": "填空-54", "type": "填空题", "question": "我国对围生期的规定是从妊娠的（____）开始至产后的（____）。", "answer": "第28周；七整天", "answers": ["第28周", "七整天"]}, {"id": "填空-55", "type": "填空题", "question": "《疾病和手术标准命名》的英文缩写是（____）,（____）英文缩写是IND。", "answer": "SNDO；国际疾病命名法", "answers": ["SNDO", "国际疾病命名法"]}, {"id": "填空-56", "type": "填空题", "question": "“见”后跟着“情况”，表示（____）", "answer": "表示主导词选择错误，必须重新选择主导词", "answers": ["表示主导词选择错误，必须重新选择主导词"]}, {"id": "填空-57", "type": "填空题", "question": "疾病第一章是（____）章，按（____）分类。", "answer": "特殊组合章；病因", "answers": ["特殊组合章", "病因"]}, {"id": "填空-58", "type": "填空题", "question": "在诸多的分类方案中，最有影响力在世界上最为普及的当数（____），全称是（____），共（____）章内容。", "answer": "ICD；疾病和有关健康问题的国际统计分类；22", "answers": ["ICD", "疾病和有关健康问题的国际统计分类", "22"]}, {"id": "填空-59", "type": "填空题", "question": "手术的核心分类是（____）、（____）", "answer": "部位；手术术式", "answers": ["部位", "手术术式"]}, {"id": "填空-60", "type": "填空题", "question": "菱形号表示（____）和（____）的原发肿瘤。", "answer": "骨源性；牙源性", "answers": ["骨源性", "牙源性"]}, {"id": "填空-61", "type": "填空题", "question": "疾病分类是根据（____）、（____）、（____）、和（____）等特性，将疾病进行排列分组，使其成为一个有序的组合。", "answer": "病因；部位；临床表现；病理", "answers": ["病因", "部位", "临床表现", "病理"]}, {"id": "填空-62", "type": "填空题", "question": "疾病分类是卫生信息领域中一个重要的学科，它集（____）、（____）、（____）、（____）、（____）等方面的知识于一身，是将原始资料加工成为信息的重要工具。", "answer": "基础医学；临床医学；临床流行病学；医学英语；分类规则", "answers": ["基础医学", "临床医学", "临床流行病学", "医学英语", "分类规则"]}, {"id": "填空-63", "type": "填空题", "question": "（____）是给疾病起一个特定的名称，使之可以区别于其它疾病。", "answer": "疾病命名", "answers": ["疾病命名"]}, {"id": "填空-64", "type": "填空题", "question": "理想的疾病名称就既能反映疾病的（____）或（____）的某些特点，又是（____）的。", "answer": "内在本质；外在表现；唯一性", "answers": ["内在本质", "外在表现", "唯一性"]}, {"id": "填空-65", "type": "填空题", "question": "疾病分类是根疾病分类据疾病的（____），按照一定的（____）把疾病分门别类。", "answer": "某些特征；规则", "answers": ["某些特征", "规则"]}, {"id": "填空-66", "type": "填空题", "question": "在疾病分类方案中，比较有影响的分类系统有（____）（____），（____）。", "answer": "SNDO；SNOMED；CPT", "answers": ["SNDO", "SNOMED", "CPT"]}, {"id": "填空-67", "type": "填空题", "question": "ICD 自（____）修订以后，加入了对医院疾病的分类。特别是从（____）修订起，更加照顾到了医院疾病统计、医疗管理和医疗付款等方面的需要，这种演变拓宽了ICD 的用途。", "answer": "第六次；第九次", "answers": ["第六次", "第九次"]}, {"id": "填空-68", "type": "填空题", "question": "通常国际疾病分类的每个层次的分类轴心只有（____）。但是类目下的亚目分类，个别情况有（____）。如：（____）粟粒性结核病的亚目，A19.0 至A19.2 的分类是以（____）为轴心，而这个类目的主要分类轴心却是（____）。", "answer": "一个；两个分类轴心；A19；部位；临床表现的急慢性", "answers": ["一个", "两个分类轴心", "A19", "部位", "临床表现的急慢性"]}, {"id": "填空-69", "type": "填空题", "question": "疾病分类的目的是为了按照所设定的方案进行（____）,（____）,（____）和（____）。", "answer": "收集；整理；分析；利用", "answers": ["收集", "整理", "分析", "利用"]}, {"id": "填空-70", "type": "填空题", "question": "ICD 是将一个疾病或一组疾病转换成（____）和（____）形式的代码，来实现数据（____）、（____）、（____）和（____），从而达到国内乃至国际间交流的目标。", "answer": "字母；数字；储存；检索；分析；应用", "answers": ["字母", "数字", "储存", "检索", "分析", "应用"]}, {"id": "填空-71", "type": "填空题", "question": "作为一个分类系统，它的基本要求是分类（____）与（____），具有（____）、（____）和（____）。", "answer": "准确性；完整性；科学性；适用性；可操作性", "answers": ["准确性", "完整性", "科学性", "适用性", "可操作性"]}, {"id": "填空-72", "type": "填空题", "question": "在ICD 的修订过程中，首次引入疾病分类是在（____）修订时。但强调（____）的思想一直保持不变。", "answer": "第六次；病因分类", "answers": ["第六次", "病因分类"]}, {"id": "填空-73", "type": "填空题", "question": "在ICD-10 的修订中，其变化最大的是引进了（____），形成（____）混合编码。", "answer": "字母；字母数字", "answers": ["字母", "字母数字"]}, {"id": "填空-74", "type": "填空题", "question": "北京世界卫生组织国际分类家族合作中心（____）正式成立。", "answer": "1981年", "answers": ["1981年"]}, {"id": "填空-75", "type": "填空题", "question": "在ICD-10 第二版中，新增加“用于特殊目的的编码”的（____）章，位置没有按字母顺序排列，而是放在（____）之后。", "answer": "第22；Z编码", "answers": ["第22", "Z编码"]}, {"id": "填空-76", "type": "填空题", "question": "除按解剖系统分类的各章外，余者是（____）。分为（____），（____），（____），（____）。", "answer": "特殊组合章；强烈优先分类章；一般优先分类章；最后分类章；附加编码章", "answers": ["特殊组合章", "强烈优先分类章", "一般优先分类章", "最后分类章", "附加编码章"]}, {"id": "填空-77", "type": "填空题", "question": "强烈优先分类章是：（____），（____）。", "answer": "第十五章；第十六章", "answers": ["第十五章", "第十六章"]}, {"id": "填空-78", "type": "填空题", "question": "一般优先分类章是：（____），（____），（____），（____），（____）。", "answer": "第一章；第二章；第五章；第十七章；第十九章", "answers": ["第一章", "第二章", "第五章", "第十七章", "第十九章"]}, {"id": "填空-79", "type": "填空题", "question": "最后分类章：（____），（____）。", "answer": "第十八章；第二十一章", "answers": ["第十八章", "第二十一章"]}, {"id": "填空-80", "type": "填空题", "question": "附加编码章：（____）", "answer": "第二十章", "answers": ["第二十章"]}, {"id": "填空-81", "type": "填空题", "question": "特殊组合章有按某一特定阶段（____）组成的章节是：（____），按某特定的疾病分类的是（____），按症状体征来分类的是（____）。", "answer": "时期；第十五、十六章；第二章；第十八章", "answers": ["时期", "第十五、十六章", "第二章", "第十八章"]}, {"id": "填空-82", "type": "填空题", "question": "三位数编码表是指（____）四位数编码表指（____）。", "answer": "类目表；内容类目表", "answers": ["类目表", "内容类目表"]}, {"id": "填空-83", "type": "填空题", "question": "疾病分类类目是指（____）亚目是指（____）细目是指（____）。", "answer": "三位数编码；四位数编码；五位数编码", "answers": ["三位数编码", "四位数编码", "五位数编码"]}, {"id": "填空-84", "type": "填空题", "question": "细目是选择性使用的编码，它提供一个与四位数分类轴心所不同的轴心分类，其特异性更强。他们出现在（____）, （____）, （____）。对于（____）是必须使用，不是选择性编码，表示（____）的（____）和（____），分别用（____）和（____）表示。", "answer": "第十三章；第十九章；第二十章；第十九章；伤口；闭合性；开放性；0；1", "answers": ["第十三章", "第十九章", "第二十章", "第十九章", "伤口", "闭合性", "开放性", "0", "1"]}, {"id": "填空-85", "type": "填空题", "question": "残余类目又称（____），指含有亚目标题（____）和（____）字样的亚目。", "answer": "剩余类目；其他；未特指", "answers": ["剩余类目", "其他", "未特指"]}, {"id": "填空-86", "type": "填空题", "question": "双重分类又称（____），指（____）和（____）编码，（____）表明疾病的（____），（____）表明疾病的（____）。", "answer": "星剑号分类系统；星号；剑号；星号；临床表现；剑号；病因", "answers": ["星剑号分类系统", "星号", "剑号", "星号", "临床表现", "剑号", "病因"]}, {"id": "填空-87", "type": "填空题", "question": "主要编码指对（____）的编码，通常是病人住院的（____）。", "answer": "主要疾病；原因", "answers": ["主要疾病", "原因"]}, {"id": "填空-88", "type": "填空题", "question": "附加编码又称（____），指除主要编码外的其他任何编码。包括（____）和（____）的编码。", "answer": "次要编码；损伤中毒的外部原因编码；肿瘤的形态学编码", "answers": ["次要编码", "损伤中毒的外部原因编码", "肿瘤的形态学编码"]}, {"id": "填空-89", "type": "填空题", "question": "当两个疾病诊断或者一个疾病诊断伴有相关的临床表现被分类到一个编码时，这个编码称之为（____）。", "answer": "合并编码", "answers": ["合并编码"]}, {"id": "填空-90", "type": "填空题", "question": "多数编码是指：用（____）以上的编码来说明一个复杂诊断报告的（____）。根据经验，一般医院编码（____）疾病诊断和（____）手术操作名称就可以满足各方面的需要。", "answer": "一个；所有成分；5个；3个", "answers": ["一个", "所有成分", "5个", "3个"]}, {"id": "填空-91", "type": "填空题", "question": "形态学编码是说明肿瘤的（____）和（____）的编码，用M 加（____）数字表示。没有（____）的新生物，将不被认为是（____），不分类到（____）章。", "answer": "组织学类型；动态；五位数；形态学编码；肿瘤；肿瘤", "answers": ["组织学类型", "动态", "五位数", "形态学编码", "肿瘤", "肿瘤"]}, {"id": "填空-92", "type": "填空题", "question": "大括号只出现在（____）中，表明括号左右两边术语的关系，一般都是（____）的关系，目的是减少重复。", "answer": "第一卷；一条与多条", "answers": ["第一卷", "一条与多条"]}, {"id": "填空-93", "type": "填空题", "question": "冒号表示术语（____），需要与冒号下的修饰词结合才是一个完整的（____）。", "answer": "内容不完整；诊断名称", "answers": ["内容不完整", "诊断名称"]}, {"id": "填空-94", "type": "填空题", "question": "NOS 是指（____），表示（____）、（____）、（____）三个方面中的某一种情况没有具体说明，出现在（____）卷。", "answer": "其他方面未特指；病因未特指；部位未特指；临床表现未特指；第一", "answers": ["其他方面未特指", "病因未特指", "部位未特指", "临床表现未特指", "第一"]}, {"id": "填空-95", "type": "填空题", "question": "NEC 是指（____），它既出现在（____）卷，也出现在（____）卷。在第一卷出现的形式是（____），在第三卷中出现的是以（____）形式。NEC 的含义是如果能够分类到其他编码，则（____）此编码。", "answer": "不可归类在他处者；第一；第三；全名称；缩略；不要采用", "answers": ["不可归类在他处者", "第一", "第三", "全名称", "缩略", "不要采用"]}, {"id": "填空-96", "type": "填空题", "question": "NOS 和NEC 实际上都有（____）作用，提示资料（____），需要进一步地在病案中查找。", "answer": "提示；不完整", "answers": ["提示", "不完整"]}, {"id": "填空-97", "type": "填空题", "question": "主导词的查找方法有（____）、（____）、（____）三种。", "answer": "首字笔画查找法；首字拼音查找法；书眉拼音查找法", "answers": ["首字笔画查找法", "首字拼音查找法", "书眉拼音查找法"]}, {"id": "填空-98", "type": "填空题", "question": "编码查找的第三步是核对编码，要在第一卷中进行。主要是看第一卷中（____）、（____）、（____）下的包括和不包括的（____）说明。", "answer": "章；节；类目和亚目；注释和指示性", "answers": ["章", "节", "类目和亚目", "注释和指示性"]}, {"id": "填空-99", "type": "填空题", "question": "编码程序是由（____）和（____）二部分组成的。", "answer": "分析病案；查找编码", "answers": ["分析病案", "查找编码"]}, {"id": "填空-100", "type": "填空题", "question": "晚期效应又称（____）是指疾病本身已不复存在，但残存着某些影响身体情况的（____）、（____）。", "answer": "后遗症；症状；体征", "answers": ["后遗症", "症状", "体征"]}, {"id": "填空-101", "type": "填空题", "question": "第一章是典型的（____），它首先强调的不是疾病的（____），而是疾病的（____）。", "answer": "特殊组合章；发生部位；病因", "answers": ["特殊组合章", "发生部位", "病因"]}, {"id": "填空-102", "type": "填空题", "question": "第一章的另一个特点是没有（____）编码，但伴随着剑号编码列有分类于其他章的（____）编码", "answer": "星号；星号", "answers": ["星号", "星号"]}, {"id": "填空-103", "type": "填空题", "question": "第一章的编码规则除另有说明者外，没有指明传染病或寄生虫病是慢性者，将按（____）的情况进行分类。", "answer": "急性或活动性", "answers": ["急性或活动性"]}, {"id": "填空-104", "type": "填空题", "question": "（____）其他传染病因的腹泻和胃肠炎；细菌性、原虫性、病毒性和其他特指的传染性病原体所引起的腹泻和胃肠炎分类于（____）。非传染性病因的腹泻和胃肠炎归类于（____）.新生儿腹泻编码为（____）。", "answer": "A09；A00-A08；K52.9；P78.3", "answers": ["A09", "A00-A08", "K52.9", "P78.3"]}, {"id": "填空-105", "type": "填空题", "question": "结核病的编码范围是: （____）。呼吸道结核病的分类轴心是：（____）。经细菌学和组织学证实的编码是:（____）。未经细菌学和组织学证实的编码是:（____）。", "answer": "A15-A19；实验室对结核杆菌检查的证实情况；A15；A16", "answers": ["A15-A19", "实验室对结核杆菌检查的证实情况", "A15", "A16"]}, {"id": "填空-106", "type": "填空题", "question": "粟粒性结核的分类轴心是：（____）。临床诊断为粟粒性肺结核要按（___ ": "颈椎病具有广义的诊断，它包括颈椎任何疾病，有（____），（____），（____），（____）等等。", "answer": "骨性关节炎；颈椎间盘脱出；椎管狭窄；颈椎裂", "answers": ["骨性关节炎", "颈椎间盘脱出", "椎管狭窄", "颈椎裂"]}, {"id": "填空-169", "type": "填空题", "question": "骨性关节炎又称（____），是一种非炎性的（____），临床也称为（____）。", "answer": "退行性关节炎；关节变性病；骨刺", "answers": ["退行性关节炎", "关节变性病", "骨刺"]}, {"id": "填空-170", "type": "填空题", "question": "当患者患有泌尿生殖系统疾病合并于产科情况时应优先分类于（____）。", "answer": "第十五章", "answers": ["第十五章"]}, {"id": "填空-171", "type": "填空题", "question": "肾小球疾病按病因分（____），（____），（____）。类目轴心是（____），亚目轴心是（____）。", "answer": "原发性；继发性；遗传性；临床表现；病理", "answers": ["原发性", "继发性", "遗传性", "临床表现", "病理"]}, {"id": "填空-172", "type": "填空题", "question": "N08.1* 是肿瘤性疾病引起的肾小球疾患，此时应将肿瘤的部位编码作为（____），即表示肾小球疾患的（____）。", "answer": "剑号编码；病因", "answers": ["剑号编码", "病因"]}, {"id": "填空-173", "type": "填空题", "question": "膀胱结石不包括鹿角形结石，分类于（____）中。", "answer": "肾结石", "answers": ["肾结石"]}, {"id": "填空-174", "type": "填空题", "question": "男性盆腔炎应分类于（____），归入（____）。", "answer": "盆腔腹膜炎；消化系统疾病", "answers": ["盆腔腹膜炎", "消化系统疾病"]}, {"id": "填空-175", "type": "填空题", "question": "N98.1 卵巢过度刺激的主导词是（____）。", "answer": "过度刺激", "answers": ["过度刺激"]}, {"id": "填空-176", "type": "填空题", "question": "妊娠、分娩和产褥期是对发生于妊娠、分娩和产褥期的（____）或（____）的分类。", "answer": "疾病；并发症", "answers": ["疾病", "并发症"]}, {"id": "填空-177", "type": "填空题", "question": "O10-O16 是对妊娠、分娩和产褥期的（____）、（____）和（____）疾患的分类，并将临床中轻、中、重度的“妊高症”区分为两大类（____）和由（____）引起的高血压。", "answer": "水肿；蛋白尿；高血压；原有高血压；妊娠", "answers": ["水肿", "蛋白尿", "高血压", "原有高血压", "妊娠"]}, {"id": "填空-178", "type": "填空题", "question": "在妊娠前血压正常，妊娠中直至分娩后24 小时内发生的高血压，但分娩后十天又恢复正常，称为（____），其编码为（____）。", "answer": "短暂性高血压；O16", "answers": ["短暂性高血压", "O16"]}, {"id": "填空-179", "type": "填空题", "question": "O95 是对（____）指明原因的妊娠、产间、产后、产褥期的死亡。", "answer": "没有", "answers": ["没有"]}, {"id": "填空-180", "type": "填空题", "question": "O98-O99 是对（____）的疾病并发于妊娠、分娩和产褥期的分类。", "answer": "可归类于他处", "answers": ["可归类于他处"]}, {"id": "填空-181", "type": "填空题", "question": "起源于围生期的情况这章包括起源于围生期但在以后发病的情况。这里的“以后”并（____）的限定，所以此章的编码可以用于（____），也可以用于（____）。 ers": ["T50.9", "Y57.9"]}, {"id": "填空-194", "type": "填空题", "question": "内科和外科医疗并发症Y40-Y84 是对内科和外科医疗并发症的（____），它包括（____）引起的并发症、（____）的副作用、（____）的意外事故等，但不包括（____）、（____）和（____）服用药物的情况。", "answer": "外因分类；医疗装置；正确服用药物；手术中；药物过量；给错；意外", "answers": ["外因分类", "医疗装置", "正确服用药物", "手术中", "药物过量", "给错", "意外"]}, {"id": "填空-195", "type": "填空题", "question": "Z47 其他矫形外科的随诊医疗应改为（____）医疗，是指主要治疗结束后的一些（____）治疗，如去除骨折内固定的螺丝钉（____）。", "answer": "继续；善后；Z47.0", "answers": ["继续", "善后", "Z47.0"]}, {"id": "填空-196", "type": "填空题", "question": "U00－U49 用于（____）或（____）的编码，U50－U99 可用于（____）临床研究，但没有内容。", "answer": "新疾病；未知疾病；特殊的", "answers": ["新疾病", "未知疾病", "特殊的"]}, {"id": "填空-197", "type": "填空题", "question": "主要疾病诊断的选择总则：在本次医疗事件中，选择对（____），（____）的诊断作为病人的主要诊断。", "answer": "建康危害最大；花费医疗经历最多，（住院时间最长", "answers": ["建康危害最大", "花费医疗经历最多，（住院时间最长"]}, {"id": "填空-198", "type": "填空题", "question": "对于复杂诊断的主要诊断选择，如果（____）能够包括一般的临床表现，则选择（____）。如果出现的临床症状不是病因的常规表现，而是疾病某种严重的后果，是疾病发展的某个阶段，那么要选择这个重要的（____）为主要诊断，但不选择疾病的（____），如呼吸循环衰竭作为主要诊断。", "answer": "病因诊断；病因诊断；临床表现；终末情况", "answers": ["病因诊断", "病因诊断", "临床表现", "终末情况"]}, {"id": "填空-199", "type": "填空题", "question": "对已治和未治疗的疾病，选择已治的疾病为（____）。", "answer": "主要诊断", "answers": ["主要诊断"]}, {"id": "填空-200", "type": "填空题", "question": "病人由于某些症状或体征或异常检查结果而住院，治疗结束时仍未能确诊，那么症状、体征或异常发现可作为（____）。", "answer": "主要诊断", "answers": ["主要诊断"]}, {"id": "填空-201", "type": "填空题", "question": "因怀疑诊断住院，在出院时仍没有确诊，怀疑诊断要按（____）编码，而且可作为（____）。而经检查后排除的可能情况要分类到（____）（____）。", "answer": "肯定诊断；主要诊断；Z03；对可疑疾病和情况的医疗观察与评价", "answers": ["肯定诊断", "主要诊断", "Z03", "对可疑疾病和情况的医疗观察与评价"]}, {"id": "填空-202", "type": "填空题", "question": "当多个诊断没有一个更为突出，而多诊断又可分类到一个被称为“多发┄┄”的类目时，选择“多发┄┄”类目的编码为（____），而对所列出的逐个情况可加用（____）。", "answer": "主要编码；附加编码", "answers": ["主要编码", "附加编码"]}, {"id": "填空-203", "type": "填空题", "question": "当两个疾病或一个疾病伴有相关的并发症有合并编码时，就要选择合并编码作为（____），不能将其（____）编码。", "answer": "主要编码；分开", "answers": ["主要编码", "分开"]}, {"id": "填空-204", "type": "填空题", "question": "后遗症的类目是用来指出（____）的情况是当前正在治疗疾病的（____）。而主要编码要选择这个正在（____）的疾病，后遗症编码可作为（____）。", "answer": "不复存在；原因；治疗；附加编码", "answers": ["不复存在", "原因", "治疗", "附加编码"]}, {"id": "填空-205", "type": "填空题", "question": "内部损伤伴有浅表性损伤或开放性伤口时，以（____）作为主要编码。", "answer": "内部损伤", "answers": ["内部损伤"]}, {"id": "填空-206", "type": "填空题", "question": "颅骨和面骨骨折伴随有颅内损伤，以（____）作为主要编码。", "answer": "颅内损伤", "answers": ["颅内损伤"]}, {"id": "填空-207", "type": "填空题", "question": "颅内出血伴随有头部其他损伤，以（____）为主要编码。", "answer": "颅内出血", "answers": ["颅内出血"]}, {"id": "填空-208", "type": "填空题", "question": "骨折伴随有同一部位的开放性伤口，以（____）为主要编码。", "answer": "骨折", "answers": ["骨折"]}, {"id": "填空-209", "type": "填空题", "question": "ICD－10 中指出，对于损伤编码，如果不想用多编码去标明开放性伤口时，可用细目（____）闭合性、（____）开放性标明。", "answer": ".0；.1", "answers": [".0", ".1"]}, {"id": "填空-210", "type": "填空题", "question": "早期的手术定义为在（____）的、采用（____）和（____）的外科操作。", "answer": "手术室进行；麻醉方式；利用手术刀", "answers": ["手术室进行", "麻醉方式", "利用手术刀"]}, {"id": "填空-211", "type": "填空题", "question": "“医疗操作分类”通常是指（____）、（____）的分类，如各种内镜的单纯（____）或检查的同时伴有（____）。", "answer": "内科诊断性；治疗性操作；诊断性检查；治疗", "answers": ["内科诊断性", "治疗性操作", "诊断性检查", "治疗"]}, {"id": "填空-212", "type": "填空题", "question": "现在广义的手术操作分类可定义为对患者直接施行的（____）及（____）操作，包括传统意义的（____）、内科（____）诊断和（____）检查及少量对（____）诊断性操作的分类。", "answer": "诊断性；治疗性；外科手术；非手术性；治疗性操作、（实验室；标本", "answers": ["诊断性", "治疗性", "外科手术", "非手术性", "治疗性操作、（实验室", "标本"]}, {"id": "填空-213", "type": "填空题", "question": "现代医学的手术分类历史可追溯到（____）年。", "answer": "1869", "answers": ["1869"]}, {"id": "填空-214", "type": "填空题", "question": "美国的《最新操作术语》简称（____）。", "answer": "CPT", "answers": ["CPT"]}, {"id": "填空-215", "type": "填空题", "question": "我国早期的手术操作分类，见于（____）北京协和医院病案科开展的手术操作编目，以解剖系统的（____）和（____）进行分类。", "answer": "1921年；部位；手术术式", "answers": ["1921年", "部位", "手术术式"]}, {"id": "填空-216", "type": "填空题", "question": "1980 年，北京协和医院编写了（____）经卫生部推荐由人民卫生出版社出版。", "answer": "《疾病分类和手术分类名称》", "answers": ["《疾病分类和手术分类名称》"]}, {"id": "填空-217", "type": "填空题", "question": "（____）年卫生部决定采用美国国际疾病分类临床修订本第三卷（____）作为我国统一使用的手术操作分类编码", "answer": "1989；ICD-9-CM-3", "answers": ["1989", "ICD-9-CM-3"]}, }, {"id": "判断-142", "type": "判断题", "question": "未指明病因的二尖瓣关闭不全按风湿性分类。", "answer": "错误"}, {"id": "判断-143", "type": "判断题", "question": "肿瘤引起的贫血为双重分类编码", "answer": "正确"}, {"id": "判断-144", "type": "判断题", "question": "单胎顺产不包括产程启动时存在枕横位。", "answer": "正确"}, {"id": "判断-145", "type": "判断题", "question": "结核病A15-A19 ，分类轴心是临床表现的急慢性。", "answer": "错误"}, {"id": "判断-146", "type": "判断题", "question": "凡采用手术分娩或其它方式助产的一定是梗阻性分娩。", "answer": "错误"}, {"id": "判断-147", "type": "判断题", "question": "手先天性变形包括手指的先天性畸形Q68 . 8 。", "answer": "错误"}, {"id": "判断-148", "type": "判断题", "question": "过敏性亚败血症是一种特指的幼年型关节炎", "answer": "正确"}, {"id": "判断-149", "type": "判断题", "question": "第二十章疾病和死亡的外因编码作为附加编码仅与第十九章一起使用。", "answer": "错误"}, {"id": "判断-150", "type": "判断题", "question": "病毒性肝炎的主导词是肝炎。", "answer": "正确"}, {"id": "判断-151", "type": "判断题", "question": "短暂性大脑缺血性发作分类于循环系统疾病章。", "answer": "错误"}, {"id": "判断-152", "type": "判断题", "question": "F55 是非依懒性物质的滥用，主导词查“依赖”。", "answer": "错误"}, {"id": "判断-153", "type": "判断题", "question": "淋巴瘤可以分为霍奇金病和非霍奇金淋巴瘤两大类。", "answer": "正确"}, {"id": "判断-154", "type": "判断题", "question": "当症状、体征和不确定情况有相关的明确诊断时，ICD-10 第18 章中的症状、体征和不确定情况仍可做主要诊断。", "answer": "错误"}, {"id": "判断-155", "type": "判断题", "question": "子宫脱垂分为完全性和不完全性脱垂。", "answer": "正确"}, {"id": "判断-161", "type": "判断题", "question": "伴复位的骨内固定术无须另编码", "answer": "正确"}, {"id": "判断-177", "type": "判断题", "question": "ICD-9-CM-3 分类规则对所有管腔端对端的吻合无需另编码", "answer": "错误"}, {"id": "判断-194", "type": "判断题", "question": "妊娠期糖尿病分类于第十五章，妊娠后糖尿病分类于第四章。", "answer": "错误"}, {"id": "简答-1", "type": "简答题", "question": "细菌学和组织学检查对呼吸道结核病分类的影响？", "answer": "呼吸道结核病分为经细菌学和组织学检查证实和未经证实两类，分别的编码是A15 和A16。\n没有指出经过证实的将被假定分类于未经证实的A16 类目中。"}, {"id": "简答-2", "type": "简答题", "question": "什么是双重分类？统计时使用哪个编码？", "answer": "星剑号编码是双重分类统，由于剑号编码是明确的病因编码，因此要严格的选择剑号编码\n为统计编码。"}, {"id": "简答-3", "type": "简答题", "question": "支气管炎的分类与假定分类", "answer": "答：支气管炎是指气管、支气管粘膜及其周围组织的非特异性炎症。分慢性支气管炎和急\n性支气管炎两种。\n１．支气管炎的分类分为急性＼亚急性和慢性；急性＼亚急性分类于J20\n２．慢性分类于慢性下呼吸道疾病J40-J47.3．\n３．慢性支气管炎伴有阻塞性肺病时有独立的分类J44\n４．年龄小于15 岁的儿童，如果未指明支气管炎的急慢性情况，可假定为急性支气管炎\n分类于J20.-。"}, {"id": "简答-4", "type": "简答题", "question": "NOS 的含义如何确定？表示哪几方面未特指？", "answer": "答案：根据分类的轴心确定NOS 的含义，表示在三个方面中的某一种情况没有具体说明，\n即：病因未特指；部位未特指；临床表现未特指。"}, {"id": "简答-5", "type": "简答题", "question": "疾病名称的构成有哪些？与疾病分类有什么关系？", "answer": "疾病名称构成有：病因、部位、临床表现、病理。它们是疾病分类的轴心。"}, {"id": "简答-6", "type": "简答题", "question": "什么是假定分类？", "answer": "是分类学中重要的方法，一般是根据临床多数发生的情况进行假定。但可能情况下，尽量找\n出明确的结果，慎重使用假定分类。"}, {"id": "简答-7", "type": "简答题", "question": "疾病编码查找方法，主导词查找方法？", "answer": "疾病编码查找方法分三个步骤：首先要确定主导词，其次是在第三卷索引中查找编码，最后\n是在第一卷中核对编码。\n主导词的查找方法：课本149 页（1-9点）"}, {"id": "简答-8", "type": "简答题", "question": "后遗症（晚期效应）的分类？", "answer": "用来指出不复存在的情况是当前正在治疗或调查的问题的起因，编码就不再强调那个不复\n存在的情况，而要优先编码后遗症的表现。\n当后遗症的表现没有指出，又不能获得进一步的说明时，后遗症的编码可以作为主要编码。"}, {"id": "简答-9", "type": "简答题", "question": "A15、A16 结核病的分类轴心？", "answer": "实验室对结核杆菌检查的证实情况"}, {"id": "简答-10", "type": "简答题", "question": "粟粒性肺结核的分类轴心？", "answer": "临床表现的急慢性"}, {"id": "简答-11", "type": "简答题", "question": "肿瘤部位编码的分类轴心是什么？", "answer": "第一个轴心是动态，第二个轴心的部位"}, {"id": "简答-12", "type": "简答题", "question": "癌和肉瘤的组织来源？", "answer": "癌：来源于内外胚层的恶性肿瘤\n肉瘤：来源于间胚层的恶性肿瘤"}, {"id": "简答-13", "type": "简答题", "question": "动态未定与性质未特指的区别？", "answer": "性质未特指（性质未肯定）是指肿物未做病理检查，仅是临床诊断为“肿瘤”。例如：腹腔\n肿瘤\nM8000/1\n动态未定（行为未定或交界恶性）：通过病理组织学的检查，肿瘤处于良恶性之间，即瘤细\n胞的良恶性转化方向不明确。"}, {"id": "简答-14", "type": "简答题", "question": "肿瘤的交搭跨越", "answer": "是指原发部位不明确的肿瘤涉及两个或两个以上相邻的部位称为交搭跨越。根据涉及的不同\n部位编码规则如下：\n1）类目相同的肿瘤，编码于该类目的.8 中，除非索引中另有特指。\n2）类目不相同的肿瘤，编码应按其所归属的系统分类。\n3）跨越系统的肿瘤，将其分类于编码C76.8。"}, {"id": "简答-15", "type": "简答题", "question": "什么是复合癌？如何编码？", "answer": "两个及以上独立肿瘤同时存在时，为复合癌。\n先编综合编码C97,M8000/3，再分别编码。"}, {"id": "简答-16", "type": "简答题", "question": "高血压肾病与肾性高血压的区别？", "answer": "高血压性肾病是由高血压累及肾，分类于I12，这个类目中包括了肾动脉硬化、动脉\n硬化性肾炎及肾硬化等病伴随有高血压。肾性高血压是一侧或两侧肾脏疾病引起的高血压，\n分类于I15 中，引起高血压的肾脏病有肾血管高血压，肾实质病变和尿路梗阻性疾病"}, {"id": "简答-17", "type": "简答题", "question": "对药物性皮炎的分类应注意什么？其假定分类是什么？", "answer": "药物性皮炎分为：药物接触性皮炎（变应性L23.3，刺激性L24.4），和内服药物性皮炎\n（L27.0-L27.1）。\nICD-10 将其假定地分类到内服性药物性皮炎，因此应注意阅读病案，区分皮炎的性质，以保\n证编码的准确性。"}, {"id": "简答-18", "type": "简答题", "question": "颈椎病的概念是什么？怎么查找编码？", "answer": "颈椎病是广义的诊断，它包括颈椎任何疾病，有骨性关节炎，椎间盘脱出，椎管狭窄，\n颈椎裂等。在临床上，最常见的是骨性关节炎，其可伴有骨髓病或神经根病。\n编码规则："}, {"id": "简答-1", "type": "简答题", "question": "假定分类：如果不做具体的描述，按临床上最常见的情况进行分类，即“骨性关节炎不", "answer": "伴有脊髓病或神经根病”分类于M47.8。"}, {"id": "简答-2", "type": "简答题", "question": "颈椎病伴有脊髓病，索引的M47.1+G99.2*。", "answer": ""}, {"id": "简答-3", "type": "简答题", "question": "颈椎病伴有神经根病，查“压迫-神经根或丛-脊椎关节强硬”得M47.2+G55.2*", "answer": ""}, {"id": "简答-19", "type": "简答题", "question": "对妊娠并发高血压的分类应注意区分什么？", "answer": "区分为两大类：原有高血压者和由妊娠引起者，分类时应注意区分两类不同情况。"}, {"id": "简答-20", "type": "简答题", "question": "产后出血的主要原因之一是什么？“胎盘滞留”的假定分类与临床的差异是什么？如何", "answer": "判断胎盘滞留是否伴出血？\n产后出血的主要原因之一是胎盘滞留，其分为四种：胎盘剥离不全或剥离后滞留、胎盘嵌顿、\n胎盘粘连、胎盘植入。\n在ICD 的分类中，前两种被假定为胎盘滞留伴出血，后两种被假定为胎盘滞留不伴出血。胎\n盘滞留无论是哪一种情况都有可能伴出血，因此在ICD 中，把只提及“胎盘滞留”者都假定\n为伴出血分类于O72.0 胎盘滞留NOS。"}, {"id": "简答-21", "type": "简答题", "question": "是否分类于第15 章的标准有哪些？", "answer": "凡孕产妇道产科医院的疾病\n主要医疗操作有产科医师参与"}, {"id": "简答-22", "type": "简答题", "question": "第十八章在特殊组合章中的地位是什么？本章的编码在什么情况下使用？", "answer": "第十八章是特殊组合章的最后分类章。"}, {"id": "简答-1", "type": "简答题", "question": "当症状、体征和实验室异常所见的疾病诊断明确时，以疾病诊断作为主要编码,症状、体征", "answer": "和实验室异常所见的编码可以省略。"}, {"id": "简答-2", "type": "简答题", "question": "只有当疾病诊断不明确时,此章的编码才能作为主要编码。", "answer": ""}, {"id": "简答-3", "type": "简答题", "question": "当某些症状、体征属于医疗上的重要问题时,除了对疾病诊断编码外,还要对其症状、体征", "answer": "进行编码。"}, {"id": "简答-23", "type": "简答题", "question": "第十九章中S 编码和T 编码的分类范围？", "answer": "S 编码是对单一部位损伤的编码；\nT 编码是:（1）用于对多部位损伤和损伤部位未特指所给予的编码，（2）是对中毒和外因的\n某些其它后果的编码。"}, {"id": "简答-24", "type": "简答题", "question": "损伤和中毒的分类轴心是什么？", "answer": "损伤部分：损伤所涉及的解剖部位及损伤的类型。\n中毒部分：导致中毒的医源性及非医源性物质。"}, {"id": "简答-25", "type": "简答题", "question": "哪些医疗并发症归类于T80-T88 手术和医疗的并发症？", "answer": "一些医疗并发症归类于T80-T88 手术和医疗的并发症。这一节编码主要是分类一些早期的\n医疗并发症和不能归类到系统章的并发症，其中许多是属于医疗事故。"}, {"id": "简答-26", "type": "简答题", "question": "第二十章疾病和死亡的外因编码是否可做主要编码？", "answer": "不可以\n解析："}, {"id": "简答-27", "type": "简答题", "question": "ICD-9-CM-3 的结构", "answer": "分为类目表和索引两个部分"}, {"id": "简答-28", "type": "简答题", "question": "手术操作名称与编码的关系", "answer": ""}, {"id": "简答-29", "type": "简答题", "question": "解剖部位对编码的影响", "answer": "解剖部位对编码的影响作为手术操作术语的核心成分,它是必须指出的,否则就难以分类或\n会被笼统地分类。不指出部位的情况鲜有发生。"}, {"id": "简答-30", "type": "简答题", "question": "手术术式对编码的影响", "answer": "手术术式对编码的影响手术术式也是手术名称的核心成分,它比部位更加重要,没有术式就\n根本无法分类。"}, {"id": "简答-31", "type": "简答题", "question": "手术入路对编码的影响", "answer": "手术入路对编码的影响通常手术的入路并不需要指出,少数情况下需要给予说明。如对垂体\n的手术,有些情况索引虽然没有要求,但临床上有意义,也必须注意,必要时可扩展编码表示入\n路。"}, {"id": "简答-32", "type": "简答题", "question": "手术目的对编码的影响", "answer": "第三版病案信息学课本第142 页，答案如下图："}, {"id": "简答-33", "type": "简答题", "question": "什么是介入治疗？超声操作的分类方法", "answer": ""}, {"id": "简答-34", "type": "简答题", "question": "简述血管支架编码的特点？", "answer": "a、周围动脉支架：主要分类为冠状和非冠状血管。非冠状血管只列出几个重要的血管，即：\n颈动脉、颅外动脉、颅内动脉等，其他的就是归类于周围血管。\nb、药物洗脱：一些文章将药物涂层支架和药物洗脱支架混为一谈，完全等同，但在分类中\n有区别，而分类中裸支架要药物涂层支架被分类在一起，药物洗脱支架单独分类。\nC、临床医生对于血管内置入支架一般都称为置入术、植入术，但实际分类操作时应查插入\n术。"}, {"id": "简答-35", "type": "简答题", "question": "产钳分类", "answer": "产钳术的临床分类根据先露高低将产钳分为高位产钳、中位产钳及低位产钳和出口产\n钳,其中中位产钳又分为高中位产钳及低中位产钳。"}, {"id": "简答-36", "type": "简答题", "question": "膝五合一修补术", "answer": "膝五合一修补术编码为81.42，它包括了内侧半月板切除术、内侧副韧带修补术、股内侧肌\n徙前术、半腱肌徙前术和鹅足转移术。记忆口诀:月付582"}, {"id": "简答-37", "type": "简答题", "question": "体被系统手术85-86 包括？", "answer": "乳房手术、皮下和皮下组织手术"}, {"id": "简答-38", "type": "简答题", "question": "亚目86.6 的分类轴心", "answer": "部位轴心：手、其他部位、毛发\n类型轴心：异体、同种、人造皮肤"}, {"id": "简答-39", "type": "简答题", "question": "主要手术操作的选择", "answer": "第三版病案信息学第163 页，答案如下图（注意标亮部分）："}, {"id": "简答-40", "type": "简答题", "question": "国际疾病分类的轴心是什么？", "answer": "疾病分类轴心是分类时所采用的疾病的某种特征。即：病因、解剖部位、临床表现和病理。\n国际疾病分类是一个以病因为主的多轴心的分类。疾病分类轴心也就是分类的标准，标准一\n旦确立，分类将围绕着标准进行。"}, {"id": "简答-41", "type": "简答题", "question": "什么是残余类目？", "answer": "指亚目标题中含有“其他”和“未特指”者。是分类那些不能归类到该类目其他特指亚目中\n的疾病，例如Q18.2 其他的鳃裂畸形。大多数残余类目的编码表现在该类目的.8 和.9。"}, {"id": "简答-42", "type": "简答题", "question": "可疑诊断的编码规则？", "answer": "在病人出院后对疾病仍不能做出肯定诊断时，有两种处理方式：\n只有一个怀疑诊断，要假定为真实疾病的存在进行编码。\n计算机录入编码，应有一个怀疑标识，以区别于肯定诊断，便于实际疾病资料的检索。\n若某一个症状或体征后，有一个或多个怀疑诊断时，只对这一症状或体征进行编码，怀疑诊\n断可视情况给于编码或不予编码。"}, {"id": "简答-43", "type": "简答题", "question": "解剖部位在什么情况下都可做主导词？", "answer": "解剖部位一般都不能做主导词，但是当部位这个词作为被修饰词时，可以作为主导词。"}, {"id": "简答-44", "type": "简答题", "question": "细目是否全部为选择性使用？", "answer": "在第19 章，表示闭合与开放性损伤的细目.0 和.1 在我国是必须使用。"}, {"id": "简答-45", "type": "简答题", "question": "肿瘤的分类轴心是什么？", "answer": "肿瘤的分类轴心：是肿瘤的动态（恶性、良性、原位、未肯定、继发性）和部位。"}, {"id": "简答-46", "type": "简答题", "question": "癌和肉瘤的组织来源于？癌与癌瘤的区别？", "answer": "癌：发生在来源于内、外胚层的组织的恶性肿瘤。\n癌瘤：是除淋巴和血液以外的恶性肿瘤的总称，英文可译为cancer，编码M8000/3。它包括\n上皮细胞癌carcinoma(通常称之为“癌”编码M8010/3)，和肉瘤sarcoma，编码M8800/3。"}, {"id": "简答-47", "type": "简答题", "question": "肿瘤的功能活性及其编码方法？", "answer": "是指肿瘤具有影响内分泌功能的能力。需要采用第四章内分泌、营养和代谢疾病的编码附加\n说明。"}, {"id": "简答-48", "type": "简答题", "question": "M8000/3 与M/8010/3 的区别？", "answer": "前者为癌瘤，后者为上皮细胞癌。"}, {"id": "简答-49", "type": "简答题", "question": "原位癌与原发癌的区别？", "answer": "原发癌：是指起源部位的癌。癌细胞可向基底膜及周围组织浸润，其细胞可以转移。动态编\n码为/3。\n原位癌：局限于起源的表浅部位，细胞没有基底膜的浸润，但有恶性改变。动态编码为/2。"}, {"id": "简答-50", "type": "简答题", "question": "发生于什么部位的息肉是属于肿瘤？", "answer": "膀胱息肉仍属于肿瘤。"}, {"id": "简答-51", "type": "简答题", "question": "什么是井号和菱形号？在编码中如何应用？对编码有什么影响？", "answer": "井号（＃）\n菱型号（◇）\n井号和菱形号只出现在第三卷索引的肿瘤表中。\n如果肿瘤的部位标有井号（＃）时，它表明如果肿瘤是鳞状细胞癌或是上皮细胞癌，就要分\n类到该部位的皮肤的恶性肿瘤中。如果肿瘤是乳头状瘤，则分类于该部位的皮肤的良性肿瘤。\n当肿瘤的部位标有菱型号（◇）时，它表明任何类型的癌或腺癌（或者说，肿瘤形态学的编码不在M91\n8–M934之间，也不是M8812/3，即不是骨内性或牙源性的肿瘤）都被认为\n是从另外一部位转移而来，要编码于C79.5。"}, {"id": "简答-52", "type": "简答题", "question": "如何判断肿瘤的性质？所有带有“瘤”字的疾病名称都是肿瘤吗？", "answer": "肿瘤的性质需要根据肿瘤的形态学编码（病理诊断）来判断。并不是所有有“瘤”字的疾\n病名称都是肿瘤，如动脉瘤，类肉瘤，胆脂瘤等。"}, {"id": "简答-53", "type": "简答题", "question": "复发癌的编码原则？", "answer": "按原发编码"}, {"id": "简答-54", "type": "简答题", "question": "非肿瘤的恶变，M 编码采用？", "answer": "M8000/3"}, {"id": "简答-55", "type": "简答题", "question": "什么是类癌综合征？如何编码？", "answer": "是伴随有类癌的一组复合症状，编码到E34.0."}, {"id": "简答-56", "type": "简答题", "question": "器质性疾病与非器质性疾病？", "answer": "“器质性”疾病是指多种原因引起的机体某一器官或某一组织系统发生的疾病，而造成该器\n官或组织系统永久性损害。这就叫做“器质性”疾病。\n“非器质性”恰恰相反，是指有各种社会心理因素造成的机体某一器官或某一组织系统的功\n能消失或减弱。而该组织或系统的结构，理化性质都正常无病变。"}, {"id": "简答-57", "type": "简答题", "question": "精神病与器质性精神病？", "answer": "精神病：指精神障碍已发展到自知力、洞察力的丧失，不能应付日常生活要求，或不能与现\n实生活保持恰当接触。\n器质性精神病：指因脑部的病理改变引起的精神障碍，如肿瘤、感染或创伤等所致。"}, {"id": "简答-58", "type": "简答题", "question": "“偏瘫”应如何正确编码？", "answer": "G81— G83 瘫痪综合征，既可以作为主要编码也可以作为附加编码，\n作为附加编码：如果医师的诊断指出了这一节编码的疾病原因时，这些编码就不能作为主要\n编码，而是作为附加编码补充说明某种疾病伴随的瘫痪情况。\n作为主要编码：只有当住院的目的是为了治疗瘫痪的临床表现时，这些编码才能作为主要编\n码。\n不包括：脊髓性偏瘫（G95.8）"}, {"id": "简答-59", "type": "简答题", "question": "G09 编码的使用？", "answer": "G09 中枢神经系统炎性疾病的后遗症\n是对G00—G08 疾病后遗症的分类，但其中G01*、G02*、G05*、G07*\n这些含有星号的类\n目其后遗症不能归类于G09。"}, {"id": "简答-60", "type": "简答题", "question": "“慢性化脓性中耳炎”分为哪三型？", "answer": "（1）单纯型\n（2）胆脂瘤型\n（3）骨疡型（骨疽）"}, {"id": "简答-61", "type": "简答题", "question": "“慢性化脓性中耳炎”分类时应注意什么？", "answer": "分类时应注意区分中耳炎的类型及病变部位。查找这些编码时，要注意根据不同类型选择主\n导词，如“耳炎” “胆脂瘤”和“骨疽”。"}, {"id": "简答-62", "type": "简答题", "question": "心脏瓣膜病的假定分类", "answer": "假定为非风湿性病因的编码\n假定为风湿性病因的编码\n二尖瓣闭锁不全I34.0\n二尖瓣狭窄I07.0\n肺动脉瓣闭锁不全I37.1\n三尖瓣闭锁不全I07.1\n肺动脉瓣狭窄I37.0\n三尖瓣狭窄I05.0\n主动脉瓣闭锁不全I35.1\n二尖瓣狭窄伴闭锁不全I05.2\n主动脉瓣狭窄I35.0\n多瓣膜狭窄I08.9"}, {"id": "简答-63", "type": "简答题", "question": "呼吸系统的疾病同时发生于一个以上的部位时，应如何编码？", "answer": "当呼吸系统的疾病发生于一个以上的部位并且没有明确的索引指明其编码时，要按较低的解\n剖部位分类，如：气管支气管炎按支气管炎编码为J40。"}, {"id": "简答-64", "type": "简答题", "question": "巨结肠的假定分类ICD-10 与ICD-9 有什么不同？", "answer": "当未指出巨结肠的病因时，在*ICD-9 中假定为先天性而分类于先天发育异常，而ICD-10 则\n按假定为后天性分类于其它肠功能疾患，K59.3"}, {"id": "简答-65", "type": "简答题", "question": "皮炎和湿疹在ICD-10 的分类中其含义相同吗？", "answer": "皮炎和湿疹两个术语可以等同和交换使用。"}, {"id": "简答-66", "type": "简答题", "question": "“亚败血症”是败血症的亚急性期吗？", "answer": "NO，幼年型斯蒂尔病编码于M08.2；斯蒂尔病NOS 编码于M08.2。"}, {"id": "简答-67", "type": "简答题", "question": "什么是重叠综合症？如何编码？", "answer": "本章两处重叠综合征："}, {"id": "简答-1", "type": "简答题", "question": "重叠性结缔组织疾病，或混合性结缔组织疾病，分类于M35.1，是指病人同时患有两种结", "answer": "缔组织疾病。分类是时应以重叠综合征编码为主（M35.1），可对不同疾病再分别编码。（主导词：\n病，混合性结缔组织或综合征，结缔组织）。"}, {"id": "简答-68", "type": "简答题", "question": "腔隙与腔隙综合征的分类？", "answer": "腔隙：指结缔组织的肌肉间腔隙，或脑腔隙。\n肌肉间腔隙综合征多为创伤性的（T79.6），脑腔隙综合征是由于脑血管病导致的（I67.9†G46.7*）。\n主导词：综合征。\n对腔隙综合征的分类首先应区分创伤性与非创伤性。分为：\n创伤性T79.6；非创伤性M62.2"}, {"id": "简答-69", "type": "简答题", "question": "膀胱鹿角形结石的编码是多少？为什么？", "answer": "分类时应注意膀胱结石不包括鹿角形结石（见N21.0的不包括），这是因为鹿角形结石的形\n成是在肾脏，它是通过输尿管落到膀胱的，因此根据其产生的部位分类于肾结石（N20.0）\n中。"}, {"id": "简答-70", "type": "简答题", "question": "男性盆腔炎的编码是多少？", "answer": "男性盆腔炎应分类于盆腔腹膜炎中K65.0，归入消化系统疾病。"}, {"id": "简答-71", "type": "简答题", "question": "什么是卵巢过度刺激综合征？", "answer": "是一种因诱导排卵所致的综合性临床表现。因而临床常以卵巢刺激综合征这样的诊断术语出\n现，但查找编码时，不能以“综合征”做主导词，而是以“过度刺激”做主导词。N98.1。"}, {"id": "简答-72", "type": "简答题", "question": "什么是短暂性高血压？", "answer": "是指妊娠前血压正常，妊娠中直至分娩后24 小时内发生的高血压，但分娩后十天又恢复正\n常者(O16)。"}, {"id": "简答-73", "type": "简答题", "question": "对妊娠子痫的分类ICD-10 的分类轴心是什么？", "answer": "子痫O15 分类轴心是子痫发作的时间阶段。\n产前子痫：在妊娠晚期或临产前发生的子痫，发生率在所有子痫的半数以上。\n产时子痫：指发生在临产启动后或在分娩过程中的子痫。\n产后子痫：指抽搐发生在胎盘娩出后，发生在产后当时至24 小时内多见。"}, {"id": "简答-74", "type": "简答题", "question": "妊娠剧吐的分类轴心？", "answer": "O21 类目分类轴心为以22 周为界，分为妊娠早期剧吐和妊娠晚期剧吐。"}, {"id": "简答-75", "type": "简答题", "question": "产科死亡的分类应注意区别什么？若使用O95 的编码怎样满足临床对资料的需求？", "answer": "关于O95--O97 产科死亡的分类：在医院的疾病分类中，这些编码只要指明了原因，则要以\n原因为主要编码，否则只能作为选择性附加编码。\nO95 是对没有指明原因的妊娠、产间、产后、产褥期死亡的分类。如果是在使用了麻醉剂时\n引起的死亡，编码则各不相同。如产后或产褥期的编码为O89.8，发生在分娩中的为O74.8，\n发生在妊娠中的编码为O29.8,如果要使用O95 说明死亡是发生在不同时期的，可通过扩展\n编码来表示。"}, {"id": "简答-76", "type": "简答题", "question": "围生期的定义及疾病的分类范围？", "answer": "围生期定义：孕22 周至产后1 周。\n范围：包括起源于围生期但在以后发病的情况。这里的“以后”并没有时间的限定，本章的\n编码可以用于婴儿，也可以用于成人。"}, {"id": "简答-77", "type": "简答题", "question": "新生儿的定义？", "answer": "产后28 天内的婴儿"}, {"id": "简答-78", "type": "简答题", "question": "子宫内低氧症的分类轴心强调了什么？", "answer": "P20 子宫内低氧症。轴心强调的是宫内低氧的发生时间，是在产程开始前还是产程和分娩中。"}, {"id": "简答-79", "type": "简答题", "question": "什么是新生儿缺血缺氧性脑病？如何分类？", "answer": "新生儿缺血缺氧性脑病：表现有意识、肌张力、呼吸节律、反射等方面的改变，尚可出现\n惊厥。根据病情分为轻、中、重度。"}, {"id": "简答-80", "type": "简答题", "question": "新生儿肺炎的假定分类是什么？", "answer": "新生儿肺炎有一部分是产后感染性的，ICD-10 将其明确地分类到P23.9（先天性肺炎）中，\n即假定为先天性的感染分类。"}, {"id": "简答-81", "type": "简答题", "question": "第十九章的细目用于分类什么情况？是否必须使用？", "answer": "第十九章细目是用以表明伤口的闭合性或开放性。本章的第五位数细目在我国要求使用，也\n就是说它不再是选择性细目，而是必须使用的细目。"}, {"id": "简答-82", "type": "简答题", "question": "膝关节脱位是否均按损伤分类？为什么？", "answer": "不是，只有近期发生的，有外部原因的损伤归入到S83,。膝关节内紊乱（M22），膝关节陈\n旧性、病理性、复发性脱位（M24），均归入M 码（13章）。"}, {"id": "简答-83", "type": "简答题", "question": "T20-T25 身体体表特指部位的烧伤和腐蚀伤的分类轴心有几个？", "answer": "第四位数表明烧伤的程度，分类轴心有三个：损伤的部位（类目轴心）、损伤的类型（烧伤和腐蚀伤\n）和程度（亚目轴心）。"}, {"id": "简答-84", "type": "简答题", "question": "T31 和T32 的编码如何使用？", "answer": "T31 和T32：这两个编码只有在没有指出烧伤或腐蚀伤的部位时才可以做主要编码，否则只\n能作为附加编码，用于补充说明T20-T29 某部位烧伤或腐蚀伤的面积。"}, {"id": "简答-85", "type": "简答题", "question": "对冻疮与冻伤的分类应注意什么？", "answer": "冻疮chilblain：是指气温在零上10 度至冰点0 度所造成的损伤。编码于T69.1\n冻伤brostbite：是冰点以下的温度，暴露于低温下由寒冷引起的以皮肤为主的损伤。编码是\nT33-T35。"}, {"id": "简答-86", "type": "简答题", "question": "内部组织、器官的破裂与外部组织的破裂主导词的选择有什么不同？", "answer": "如果遇到内部组织、器官的破裂，常以“损伤”作为主导词；外部组织的破裂以“伤口”作\n为主导词。"}, {"id": "简答-87", "type": "简答题", "question": "中毒和有害效应的概念？", "answer": "中毒：是指给错物品或用错方法，或过量服用药物引起机体的有害反应。\n有害效应：表示机体在合理使用正确物质的情况下产生的“过敏”或“反应”。"}, {"id": "简答-88", "type": "简答题", "question": "中毒的物质是怎样分类的？", "answer": "中毒的物质分为两大类：药物、药剂和生物制品的中毒分类于T36-T50；\n主要为非药用物质的毒性效应分类于T51-T65。"}, {"id": "简答-89", "type": "简答题", "question": "引起中毒的外因是按什么分类的？", "answer": "引起中毒的外因是按其性质分类的，如：意外、自害、他杀、意图不确定等"}, {"id": "简答-90", "type": "简答题", "question": "疾病命名在临床工作中会遇到那些情况：", "answer": "①一种疾病有几种不同的名称例如：肝豆状核变性又称威尔逊病。②以人名或地名\n命名的疾病③随意命名疾病④与国际上命名有冲突的特定含义命名"}, {"id": "简答-91", "type": "简答题", "question": "ICD-10 分类系统具有的特点？", "answer": "科学性、准确性、完整性、适用性、可操作性"}, {"id": "简答-92", "type": "简答题", "question": "国际疾病分类家族有哪些？", "answer": "（1）初级卫生保健的信息支持（2）其他与健康有关的分类（3）国际疾病命名法\n（IND）（4）专科适用本"}, {"id": "简答-93", "type": "简答题", "question": "为什么医生在书写疾病诊断时不能按照ICD 疾病名称书写？", "answer": "国际疾病分类是分类的国际标准，也是各国进行卫生信息交流的基础。国际疾病分类\n不是疾病命名的标准。因此，医师书写疾病诊断时可以参考ICD-10 中的疾病诊断，但不能\n要求完全按照ICD-10 书写诊断，因为ICD-10 不是标准疾病命名。"}, {"id": "简答-94", "type": "简答题", "question": "在我国推行国际疾病分类的意义？", "answer": "①国内与国际交流。②医疗、研究与教学病案资料的检索。③管理信息的提取。④\n医疗付款管理。⑤医院评审。"}, {"id": "简答-95", "type": "简答题", "question": "在ICD－10 第一卷中内容是怎样排列的？", "answer": "在ICD－10 第一卷中，我们经常要使用的是内容类目表和四位数亚目、肿瘤的形态学\n编码。这两部分编码的编排方法首先是按照英文字母的顺序，然后是按数字的大小顺序排列。"}, {"id": "简答-96", "type": "简答题", "question": "星剑号分类系统的应用规则如下：", "answer": "（1）ICD-10 中认为星号编码是选择性使用的附加编码，而建立星号编码的理由是剑\n号编码不能满足“特定专科有关的统计表”制定的要求。在我国，双重分类系统是强制性使\n用，即不能单独使用剑号编码，有剑号编码时，一定要附上星号编码。\n（2）星剑号双重分类涉及主要编码的选择，由于剑号编码是明确的病因编码，因此要严格\n的选择剑号编码为统计编码。如果采用星号编码做统计时，需要有明确的说明。例如：糖尿\n病性白内障E14.3？H28.0*，要选择E14.3？的编码作为统计编码。"}, {"id": "简答-97", "type": "简答题", "question": "ICD-10 全书共有多少个星剑号编码？它们出现的情况是怎样的？", "answer": "ICD-10 全书共有83 个星剑号编码，它们出现的情况如下：\n（1）类目或亚目标题出现剑号或星号，说明整个类目或亚目都适用于双重分类\n（2）类目标题没有剑号或星号，但其中含的个别亚目标有星剑号编码的，说明该亚目适用\n于双重分类。\n（3）亚目标题有的同时提供了星剑号，说明该标题下的内容都有统一的星剑号编码。如果\n亚目标题仅有剑号（或星号）编码而没有星号（或剑号）编码时，说明该亚目下的疾病条\n目有不同的剑号（或星号编码）。"}, {"id": "简答-98", "type": "简答题", "question": "简述疾病分类编码查找的方法？", "answer": "简述疾病分类编码查找的方法分为三个步骤，首先要确定主导词，其次是在第三卷索\n引中查找编码，最后是在第一卷中核对编码。对于肿瘤的编码操作，由于它具有两个编码，\n所以要两次操作。"}, {"id": "简答-99", "type": "简答题", "question": "主导词的查找方法中哪种方法最便捷？为什么？", "answer": "最便捷的查找方法是书眉拼音查找法。在索引中每页的上端都有一长线，线上标明是\n第几部分索引，第几页，而且列有本页出现的主导词首字及首字拼音。采用此法，可以很容\n易确定整个主导词的位置，而不仅仅是首字的位置。一旦没有查到某个假定的主导词，也可\n以确定其位置或肯定该词不能作为主导词。"}, {"id": "简答-100", "type": "简答题", "question": "对于怀疑诊断该怎样处理?", "answer": "在病人出院时仍不能做出肯定的疾病诊断，有两种处理方式：\n(1) 只有一个怀疑诊断，这里要假定为实际情况编。\n(2) 当某一个症状或体征后，跟随一个或多个怀疑诊断时，只编码症状，怀疑诊断可视情况\n编码或不予编码。"}, {"id": "简答-101", "type": "简答题", "question": "恶性肿瘤和良性肿瘤的区别？", "answer": "恶性肿瘤细胞以浸润性方式生长，并可以通过淋巴、血液、浆膜腔转移。良性肿瘤细\n胞不以浸润性方式生长且生长缓慢，肿瘤有一个完整的被膜，细胞不转移。"}, {"id": "简答-102", "type": "简答题", "question": "肿瘤的编码规则有哪些？", "answer": "（1）．如果诊断没有指明是继发性的肿瘤，索引中也没有其他说明，则肿瘤编码按\n原发性处理。（2）．肿瘤的交搭跨越：原发部位不明确的肿瘤，如果肿瘤涉及两个或两\n个以上相邻的部位称为交搭跨越。编码的规则是：类目相同的肿瘤，编码到该类目的.8 中。\n如果索引另有特指，则按指示编码。类目不相同，按归属的系统分类(见书P251) 。跨越系\n统的肿瘤在ICD-10 中我们将其分类于C76.8。（3）．异位组织的恶性肿瘤编码于所提及的\n部位，如：异位胰腺恶性肿瘤C25.9。"}, {"id": "简答-103", "type": "简答题", "question": "内分泌、营养和代谢疾病的编码原则是什么?", "answer": "1.分类于本章的疾病有一些是由于药物或外因所致，应以本章的编码为主，第二十章\n的编码作为附加编码。2.当肿瘤具有功能活性或由于异位内分泌组织所致的功能活性.可用本\n章的适当编码（如，E05.8，E07.0，E16-E31,E34.-）作为附加编码。"}, {"id": "简答-104", "type": "简答题", "question": "营养缺乏与营养过度后遗症在何种情况下才能做主要编码？", "answer": "当没有指出了营养缺乏与营养过度后遗症的具体表现时，则E64.-及E68 可作为主要\n编码；如果指出了营养缺乏与营养过度后遗症的具体表现时，他们只能作为选择性附加编码。"}, {"id": "简答-105", "type": "简答题", "question": "请描述F10-F19 与F55 编码的区别,其主导词分别是什么?", "answer": "F10-F19 是精神活性物质引起的精神和行为障碍，该物质有成瘾性，因此查找相应疾\n病的编码时，主导词用“依赖”；F55 是非依赖性物质滥用，查找编码主导词用“滥用”。"}, {"id": "简答-106", "type": "简答题", "question": "简述神经炎与神经病的关系，编码是就注意什么？", "answer": "诊断中的神经炎与神经病常是相通的名称。若临床诊断为神经炎，多指单神经的病变，\n若诊断为某神经的变性，常是指多神经病。编码时应注意分析诊断。"}, {"id": "简答-107", "type": "简答题", "question": "简述H43.0 与H43.8 编码的区别？", "answer": "H43.0 为玻璃体脱出，自瞳孔区域突出于前房，H43.8 为玻璃体脱离，两者的疾病性\n质不同，使用时应注意不可混淆两者的概念。"}, {"id": "简答-108", "type": "简答题", "question": "H54.- 盲和视力低下的编码规则有哪些？", "answer": ""}, {"id": "简答-1", "type": "简答题", "question": "如果指出了造成盲和视力低下的原因时，H54.-的编码就不能作为主要编码，只能作为选", "answer": "择性附加编码。只有当治疗的目的本身就是为了盲和视力低下，这个类目的编码才能作为主\n要编码。"}, {"id": "简答-2", "type": "简答题", "question": "对于因创伤引起的盲和视力低下，应注意区分是近期损伤还是晚期效应。若为近期损伤", "answer": "所造成，其编码在第十九章。"}, {"id": "简答-109", "type": "简答题", "question": "简述H90 传导性和感音神经性听觉丧失，H91 其他听觉丧失的编码规则？", "answer": "对于这两个类目的编码只有当未指出其原因时，才能作为主要编码。否则，他们只能\n作为选择性附加编码。对于H91.0 耳毒性听觉丧失，需要时可使用附加外因编码（第二十章）\n标明毒性物质。"}, {"id": "简答-110", "type": "简答题", "question": "简述循环系统疾病的编码规则？", "answer": "1.急性心肌梗死以4 周（28天）为限，超过这一时间为慢性。2．若慢性风心病有风\n湿的活动表现，住院治疗风湿热，则风湿热的编码为主，慢性风湿性心脏病的编码为附。3．凡\n未提及病因的二尖瓣、主动脉瓣和肺动脉瓣的闭锁不全按假定为非风湿性编码，三尖瓣的闭\n锁不全按假定为风湿性编码。4．凡未提及病因的心脏瓣膜的主动脉瓣和肺动脉瓣的狭窄，\n按假定为非风湿性编码。而二尖瓣、三尖瓣的狭窄则按假定为风湿性编码。5．凡未提及病\n因的心脏多瓣膜疾病，按假定的风湿性病因处理编码。如：I08 多个心脏瓣膜病。"}, {"id": "简答-111", "type": "简答题", "question": "什么叫重叠综合征？怎样编码？", "answer": "重叠综合征即重叠性结缔组织疾病，是指病人患有两种或两种以上结缔组织病。分类\n应以重叠综合征编码为主（M35.1），再对不同疾病分别编码。例如：病人同时患有干燥综\n合征及系统性红斑狼疮其主要编码为M35.1，附加编码为M35.0 和M32.0。"}, {"id": "简答-112", "type": "简答题", "question": "为什么在编码肌萎缩时要认真阅读病案？", "answer": "因为肌萎缩有二种查找方法，不同查找方法得到的编码代表着不同的疾病。如果在索\n引中直接查主导词“肌萎缩”，得到编码是G71.8。如果查萎缩— 肌肉得到编码是M62.5。\n两者的区别是前者为肌的原发性疾病，而后者不是原发性疾病，所编码人员在编码时要养成\n阅读病案的习惯。"}, {"id": "简答-113", "type": "简答题", "question": "简述腔隙综合征的编码方法？", "answer": "腔隙指结缔组织的肌肉间腔隙，或脑腔隙。肌肉间腔隙综合征多为创伤性的（T79.6），\n脑腔隙综合征是由于脑血管病导致的（I67.9？G46.7*）。胫骨前区综合征，又称“间隔综\n合征”和“胫骨前肌综合征M76.8”。\n分类腔隙综合征时，首先要确定创伤性T79.6 或非创伤性M62.2。胫骨前（或后）区综合征\n则归属于肌腱端病，分类于M76.8 。"}, {"id": "简答-114", "type": "简答题", "question": "病人同时患有干燥综合征和系统性红斑狼疮应分别给予编码", "answer": "病人同时患有干燥综合征及系统性红斑狼疮其主要编码为M35.1，附加编码为M35.0\n和M32.0。"}, {"id": "简答-115", "type": "简答题", "question": "简述O32-O34 与O64-O66 的区别与联系?", "answer": "在妊娠期和未进入产程时存在O32-O34 情况需要治疗时，可分类于O32-O34。当产\n妇已经进入产程仍存在O32-O34 情况，需要手法助产或手术分娩时，就应分类于梗阻\n性分娩O64-O66。"}, {"id": "简答-116", "type": "简答题", "question": "ICD-10 胎盘滞留(O72.0)是否伴有出血的假定，与临床上的假定一致吗？", "answer": "不一致，对于没有指明是否伴有出血者，ICD-10 按假定为产后出血给予编码。而我国\n的临床上不注明伴有出血，说明没有出血。因此要特别注意胎盘滞留的假定分类，明确是否\n伴有出血，以避免分类错误"}, {"id": "简答-117", "type": "简答题", "question": "判断应归于妊娠、分娩和产褥期章节的标准是什么？", "answer": "（1）凡孕产妇到产科医疗的疾病，（2）主要医疗操作有产科医师参与，（3）对于\n那些微小的伴随疾病，如皮炎，手指切伤等，可归类于相应的身体系统或损伤章节。"}, {"id": "简答-118", "type": "简答题", "question": "简述主导词“异常anomaly”和“异常的abnormal”的区别？", "answer": "主导词“异常anomaly”，表示先天发育不正常。“异常的abnormal”表示不正常的\n意思，但通常不是先天性的，例如一些实验室或功能性检查结果不正常就要查“异常的\nabnormal”这个主导词。"}, {"id": "简答-119", "type": "简答题", "question": "损伤可分为哪几种类型？", "answer": "损伤可分10 种类型：1．浅表损伤2．开放性伤口3．骨折4．脱位、扭伤和劳损5.\n神经和脊髓损伤6．血管损伤7．肌肉和肌腱损伤8．挤压伤9．创伤性切断10．内部器官\n损伤。"}, {"id": "简答-120", "type": "简答题", "question": "简述第十九章损伤、中毒和外因的某些其他后果的编码原则？", "answer": "多处损伤尽可能采用多数编码的原则逐个编。2．未特指开放性损伤者，按闭合性损\n伤处理编码。3．多处损伤综合编码的规则。4. 颅骨和面骨骨折伴有颅内损伤时，要分开书\n写诊断，并选择颅内损伤作为主要编码。5. 本章中广泛使用的“和”是指“和/或”的意思。"}, {"id": "简答-6", "type": "简答题", "question": "本章的部分类目中含有选择性使用的第5 位数，它是用以表明伤口的闭合性或开放性，", "answer": "但我国要求必须使用细目编码。"}, {"id": "简答-121", "type": "简答题", "question": "简述烧伤和腐蚀伤的编码方法？", "answer": "烧伤和腐蚀伤在分类中一般都同等对待，但根据体表面积的烧伤（T31）和腐蚀伤（T32）\n是分别编码的。T20-T25 是分类体表的烧伤和腐蚀伤，第四位数表明烧伤的程度；T26-T28\n是眼或内部器官的烧伤和腐蚀伤，第四位数表明烧伤的部位；T29-T30 是多部位的烧伤和腐\n蚀伤。T31 和T32 两个编码只有当没有指出烧伤或腐蚀伤的部位时才可以做主要编码，否则\n只能作附加编码。"}, {"id": "简答-122", "type": "简答题", "question": "有害效应的分类方法？", "answer": "有害效应是指恰当地使用治疗量或预防剂量的正确药物引起的过敏等不良反应。对于\n有害效应可用A00-R99 对其临床表现编码，并用第二十章的Y 编码说明引起有害效应的物质，\n对于药物和药剂未特指其临床表现的有害效应编码于T88.7，对于不明原因的有害效应编码\n于T78.- 。有害效应的后遗症采用T96-T97 的编码附加说明后遗症或陈旧性情况。"}, {"id": "简答-123", "type": "简答题", "question": "简述外因分类第一轴心的分类范围有哪些?", "answer": "第一轴心分类的范围有:意外事故V01-X59，故意自伤和自杀X60-X84，加害X85-Y09，\n依法处置和作战行动Y35-Y36，内科和外科医疗并发症Y40-Y84，意图不确定Y10-Y34。"}, {"id": "简答-124", "type": "简答题", "question": "简述Z54 恢复期与Z98 其他手术后状态的区别？", "answer": "手术和操作都可以有恢复期，这是康复过程。但如果恢复期中有治疗，如对造口的维\n护等，就要强调治疗，恢复期可作为附加编码。手术后状态是指手术后长期处于某种状态下。\n如关节固定术后。"}, {"id": "简答-125", "type": "简答题", "question": "可以用“切开”作主导词的手术包括哪些？", "answer": "可以用“切开”作主导词的手术有：引流术、异物取出术、探查术、减压术、穿刺术、\n切断术、取出术、清除术、脓肿去除术、血肿去除术等。"}, {"id": "简答-126", "type": "简答题", "question": "哪些术式可以互为交叉索引？", "answer": "修补术、建造术、成形术、再造术、整形术、重建术、矫正术、扩张术、裂伤缝合术、\n闭合术、造瘘术、松解术、移植术等术式是相互关联的，当用其中某个术式作主导词查不到\n编码时，可以按照对手术方法的了解转换成这里的其他适当术式作为主导词查找，即可以互\n为交叉索引。分流术、搭桥术、吻合术等也可以互为交叉索引。"}, {"id": "简答-127", "type": "简答题", "question": "为什么说在手术分类中，通常不必指出疾病的性质？", "answer": "在手术分类中，通常不必指出疾病的性质。其理由有两个，第一是疾病的性质在疾病\n分类中已给予编码；第二是手术主要是强调手术的部位范围和术式，因此有时没有必要指出\n疾病的性质，这样可以减少索引条目。例如：胃部位切除术，它可以对多种疾病进行治疗。\n如果一一指出疾病，则手术名称的条目将成几何性增长。"}, {"id": "简答-128", "type": "简答题", "question": "手术分类中涉及药物制剂的分类有哪些？", "answer": "药物制剂的应用一般不需要分类。涉及药物的操作编码有两处可以分类，一处是在"}, {"id": "简答-0", "type": "简答题", "question": "1 编码，主要是一些新的肿瘤用药。另一处涉及药物的操作编码是99.1 和99.2 编码，除", "answer": ""}, {"id": "简答-99", "type": "简答题", "question": "25 肿瘤化学治疗性的药物外，其他是非肿瘤性的治疗药物和药剂，治疗的方式是通过注", "answer": "射和输注。"}, {"id": "简答-129", "type": "简答题", "question": "第1 章操作与介入包括哪些手术？", "answer": "包括：42、00.0 治疗性超声，00.1 药物制剂，00.2 血管的血管内显像，00.3 计算机\n辅助外科手术（CAS），00.4 附属血管系统操作，00.5 其他心血管系统操作，00.6 血管操作，"}, {"id": "简答-0", "type": "简答题", "question": "7 髋关节的其他操作，00.8 膝关节和髋关节的其他操作，00.9 其他操作和介入。", "answer": ""}, {"id": "简答-130", "type": "简答题", "question": "神经系统手术包括哪些？", "answer": "01 颅、脑和脑膜的切开术和切除术，02 颅、脑和脑膜其他手术，03 脊髓和椎管结构\n的手术，04 颅的和周围神经的手术，05 交感神经或神经节的手术。"}, {"id": "简答-131", "type": "简答题", "question": "白内障按病因分哪几类？", "answer": "白内障按病因分为年龄相关性（老年性）、外伤性、并发性、代谢性、中毒性、辐射\n性、发育性和后发性白内障等。"}, {"id": "简答-132", "type": "简答题", "question": "白内障手术编码时要注意什么？", "answer": "白内障手术编码时主导词要选择“摘除术（抽吸）”，要特别注意人工晶体的植入术\n是一期还是二期，如果是一期手术，则首先要编码不同手术方式的摘除术，例如：折内障超\n声乳化抽吸术伴人工晶状体植入术，主要编码为13.41，人工晶体一期植入的编码是13.71\n作为附加编码。如果是二期手术，则只编码人工晶体的植入，主导词查：插入，编码为13.72。"}, {"id": "简答-133", "type": "简答题", "question": "视网膜裂孔修补术主要有哪几种，其编码是多少？", "answer": "视网膜裂孔修补术主要有透热术14.31，冷冻术14.32，氙弧光凝固术14.33，光凝术"}, {"id": "简答-134", "type": "简答题", "question": "视网膜脱离的再附着性修补术主要有几种？其编码是多少？", "answer": "视网膜脱离的再附着性修补术主要有透热术14.51，冷冻术14.52，氙弧光凝固术14.53，\n光凝术14.54。"}, {"id": "简答-135", "type": "简答题", "question": "眼部手术包括哪些手术？", "answer": "包括：08 眼睑手术，08 眼睑手术，10 结膜手术，11 角膜手术，12 虹膜、睫状体、\n巩膜和前房的手术，13 晶状体手术，14 视网膜、脉络膜、玻璃体和后房手术，15 眼外肌手\n术，16 眼眶和眼球手术。"}, {"id": "简答-136", "type": "简答题", "question": "补充心血管操作分类可分几类，分别是什么？", "answer": "补充心血管操作分类共有三处，分别为：⑴其他心血管00.5-心脏再同步；⑵心血管\n操作00.6-非冠状血管支架；⑶附加的心血管操作17.5-其他补充。"}, {"id": "简答-137", "type": "简答题", "question": "叙述成形术、整形术、修补术的关系与区别？", "answer": "修补术可能因缺损而整形，因而整形术可列入修补术中。在索引中也有指示要更换为\n修补术的主导词。成形术常常是通过手术，形成新的形状。例如，隆鼻术，可视为鼻成形术。\n成形术不能作为主导词，一般要以部位+成形术构成主导词。"}, {"id": "简答-138", "type": "简答题", "question": "鼻内上颌窦切开术怎样编码？", "answer": "鼻内上颌窦切开术，临床上常称为“下鼻道开窗术”。应按上颌窦切开术才能查到准\n确的编码。上颌窦切开术或上颌窦根治术22.31，主导词用“窦切开术（鼻的）。这里的根\n治术和肿瘤的根治术不是一个概念，该手术主要用于解决上颌窦的慢性脓肿或囊肿，手术目\n的在于彻底清洗窦腔。"}, {"id": "简答-139", "type": "简答题", "question": "鼻、口、咽部手术包括哪些手术？", "answer": "包括：21 鼻手术，22 鼻窦手术，23 牙的拔除与修复，23 牙的拔除与修复，25 舌手\n术，26 唾液腺和管的手术，27 口和面的其他手术，28 扁桃腺和腺样增殖体的手术，29 咽部\n手术。"}, {"id": "简答-140", "type": "简答题", "question": "声带手术有几种分型？", "answer": "声带又称声壁，是发声器官的主要组成部分。位于喉腔中部，由声带肌、声带韧带和\n黏膜三部分组成，左右对称。声带麻痹外科发展迅速，下列前四型是日本学者提出的，而Ⅴ，\nⅥ，Ⅶ型是中国学者提出的，其中的Ⅶ尚在研究中。Ⅰ型、使声带内移。Ⅱ型、使声带外展，\nⅢ型、使声带缩短，Ⅳ型、使声带延长，Ⅴ型、女性喉结切除，适用于女性喉结患者，Ⅵ型、\n男性喉结成形术，适用于男性无喉结患者，Ⅶ型、即混合型。声带麻痹的上述手术在分类中\n只能分到喉的其他手术，编码为31.98。"}, {"id": "简答-141", "type": "简答题", "question": "单纯的肺部手术从轻微的部位到全部依次可分为哪些手术？", "answer": "单纯的肺部手术从轻微的部位到全部依次可分为：32.2 肺病损或组织的局部切除术或\n破坏术，32.3 肺节段切除术，32.4 肺叶切除术，32.5 全肺切除术，32.6 胸腔结构的根治性\n清扫术（包括支气管、肺叶、臂丛神经、肋间结构、肋骨和交感神经的清扫。）"}, {"id": "简答-142", "type": "简答题", "question": "呼吸系统手术包括哪些手术？", "answer": "呼吸系统手术包括：30 喉切除术，31 喉和气管的其他手术，32 肺和支气管切除术，\n32 肺和支气管切除术，33 肺和支气管的其他手术，34 胸壁、胸膜、纵膈和横隔手术。"}, {"id": "简答-143", "type": "简答题", "question": "冠状动脉血管搭桥术怎样分类？", "answer": "冠状动脉血管搭桥术的分类，有对一根动脉，两根动脉、三根动脉、四根或更多动脉\n的搭桥术的分类。如果临床未指明是对几根动脉进行的搭桥术，则按一根动脉的手术处理编\n码。"}, {"id": "简答-144", "type": "简答题", "question": "心血管系统手术包括哪些手术？", "answer": "答案：35 心脏瓣膜和间隔手术，36 心脏血管手术，37 心脏和心包的其他手术，38 血管的\n切开、切除和闭合术，39 血管其他手术"}, {"id": "简答-145", "type": "简答题", "question": "简述淋巴结构手术的分类方法？", "answer": "所谓淋巴结构是指淋巴结和淋巴管。单纯淋巴结构的切除如果是为了活组织检查，分\n类于40.11；如果是治疗性的切除，编码为40.2-。淋巴结构的其他切除术主要是为防止肿瘤\n转移的预防性切除，一般是区域性的清扫术和根治术,编码于类目40.3-40.5。"}, {"id": "简答-146", "type": "简答题", "question": "消化系统手术包括哪些手术？", "answer": "42 食管手术；42 食管手术；44 胃的其他手术；45 肠切开术.切除术和吻合术；46\n肠的其他手术；47 阑尾手术；48 直肠.直肠乙状结肠和直肠周围组织的手术；49 肛门手术；\n50 肝脏手术；51 胆囊和胆道手术；52 胰腺手术；53 疝修补术；54 腹部其他手术。"}, {"id": "简答-147", "type": "简答题", "question": "消化系统中其他常见手术术式有哪些？", "answer": "⑴闲置术：也称旷置术，手术使肠段不再有任何功能和作用。主导词用“旷置术”。\n⑵外置术：手术使器官置于体外。如：食管袋的外置，肠外置。⑶包埋术：又称袋型缝合\n术。⑷还纳术：疝气的还纳术，主导词用“修补术”；造口的还纳术，主导词用“闭合术”。\n⑸肠段分离术：是对正常肠段的切除，目的是用于代替其他空腔器官。主导词“切除术”\n或“分离术”。"}, {"id": "简答-148", "type": "简答题", "question": "泌尿系统结石常用的手术方式有哪些？", "answer": "根据结石大小、形状和部位不同，常用的手术方式有以下几种。⑴肾盂或肾窦切开\n取石术：⑵肾实质切开取石术⑶肾部分切除术⑷肾切除术⑸输尿管切开取石术⑹套\n石术。"}, {"id": "简答-149", "type": "简答题", "question": "性转变手术怎样编码？", "answer": "性转变手术编码为64.5 ，在这个亚目后有NEC 指示，说明这是一个不明确的手术名\n称。性转变手术分为女性转为男性或男性转为女性的两大类型手术。64.5 这个编码是被假\n定为女性转为男性的笼统手术名称。"}, {"id": "简答-150", "type": "简答题", "question": "男性生殖器官手术包括哪些手术?", "answer": "前列腺和精囊手术，阴囊和睾丸鞘膜手术，睾丸手术，精索、附睾和输精管的手术，\n阴茎手术"}, {"id": "简答-151", "type": "简答题", "question": "女性生殖器官手术包括哪些手术？", "answer": "卵巢手术，输卵管手术，子宫颈手术，子宫的其他切开术和切除术，子宫和支持结构\n的其他手术，阴道和直肠子宫陷凹手术，外阴和会阴的手术。"}, {"id": "简答-152", "type": "简答题", "question": "产科操作包括哪些手术？", "answer": "产科操作包括产钳、真空吸引和臀位分娩，其他引产或助产操作，剖宫产术和胎儿取\n出，其他产科手术"}, {"id": "简答-153", "type": "简答题", "question": "什么是合并编码？试举例说明。", "answer": "当两个疾病诊断或一个疾病诊断伴有相关的临床表现被分类到一个编码时，这个编码\n称之为合并编码。如慢性胆囊炎伴胆石症，编码为K80.1，不能分别编码为慢性胆囊炎\nK81.1 和胆石症K80.5。"}, {"id": "简答-154", "type": "简答题", "question": "在我国，“慢性迁延性肝炎”的ICD-10 编码是什么？在编码时就注意哪些问题？", "answer": "“慢性迁延性肝炎”的ICD-10 编码是B18.9，编码时就注意：（1）首先，注意假定\n分类的合理使用，a.在我国，“慢性迁延性肝炎”临床上的常用见情况是病毒性的，且\n公众一致认同，在编码时假定为病毒性慢性迁延性肝炎来处理。b.就在分析病案后，再\n使用假定分类，若分类性质明确，以病人的实际情况为准。（2）还要注意病案中肝炎\n病毒分型的信息。"}, {"id": "简答-155", "type": "简答题", "question": "NOS 和NC 两个缩略语都说明什么？分类中如何应用？", "answer": "NOS：其他方面未特指，出现在第一卷，根据分类的轴心，表示三个方面中的某一种\n情况没有具体说明：1、病因未特指。2、部位未特指。3：临床表现未特指。NEC：不\n可归类在它处者，如果能够分类到其他编码，则不要采用此编码"}, {"id": "简答-156", "type": "简答题", "question": "合并编码与多数编码有什么区别？分类中如何应用？", "answer": "合并编码是两个疾病诊断或者一个疾病诊断伴有相关的临床表现被分类到一个编码。\n如慢性胆囊炎伴胆石症，编码为K80.1，不能分别编码。多数编码为用一个以上的编码来说\n明一个复杂的诊断报告的所有成分。从各方面的用途考虑，采用多数编码都有好处，但过多\n过细的分类必然会增加工作量。因此，建议只对进行了治疗的疾病编码，对于未进行治疗而\n又与主要疾病相关或可能相关，今后在科研中可能会应用的疾病酌情编码。"}, {"id": "简答-157", "type": "简答题", "question": "E83.4 包含高镁血症和低镁血症，它们的临床表现不同，为什么分在一个亚目中？", "answer": "因为E83.4 这个亚目明确指出是镁代谢紊乱，高镁血症和低镁血症虽然临床表现不同，\n但它都属于镁代谢紊乱，所以分类到同一个亚目"}, {"id": "简答-158", "type": "简答题", "question": "慢性风湿性心脏病编码规则", "answer": "慢性风湿性心脏病有风湿活动的表现时，住院治疗风湿热，则风湿热为主要编码，慢\n性心脏病为附加编码"}, {"id": "简答-159", "type": "简答题", "question": "高血压分类如何更适合临床使用", "answer": "高血压的ICD 编码范围是I10-I15，I10 是特发性（原发性）高血压。I11 高血压心脏病。\nI12 高血压肾脏病。I13 高血压心脏和肾脏病。I15 继发性高血压。I10 包括了良性高血压和\n恶性高血压，其下没有亚目，可根据临床表现在其下进行扩展编码，这样便于反映临床特征"}, {"id": "简答-160", "type": "简答题", "question": "急性心肌梗死I21 分类轴心", "answer": "类目轴心为透壁性和非透壁性。亚目轴心为心肌病的部分"}, {"id": "简答-161", "type": "简答题", "question": "I65、I66 与I63 类目区别", "answer": "I65：入脑前动脉的闭塞和狭窄。I66：大脑动脉的闭塞和狭窄。两者都未造成脑梗死。\nI63 是大脑前动脉和大脑动脉的闭塞和狭窄，造成脑梗塞。"}, {"id": "简答-162", "type": "简答题", "question": "支气管哮喘与喘息性支气管炎区别", "answer": "1、支气管哮喘简称哮喘，是支气管高压反应状态下由于变应原或其他因素引起广泛\n气道狭窄的疾病，临床特点为发作性胸闷、咳嗽，大多带有哮鸣音的呼气性呼吸困难，\n编码为J45.-。2、喘息性支气管炎，有慢性咳嗽、咳痰伴有喘息，并经常或多次出现哮\n鸣音者，分为两种：慢性喘息性支气管炎，编码J44.8；急性喘息性支气管炎，是一种\n特殊类型的急性支气管炎，现在称为“毛细支气管炎”编码为J21，按“细支气管炎”\n查找"}, {"id": "简答-163", "type": "简答题", "question": "流感伴并发症时怎么编码", "answer": "1、当由于流感引起的并发症或伴有一些伴随疾病，而且治疗也与流感有关，则以流\n感为主要编码。2、J10 与J11 的不包括，无论是否标明流感由何种病毒引起，其不包括\n都相同，也都包括胃肠型流感。"}, {"id": "简答-164", "type": "简答题", "question": "胸膜炎ICD-10 根据什么分类？", "answer": "按照疾病性质分类，当未指出其疾病的性质是，被分类于第十八章R09.1 中，指明了\n疾病性质则被分类于呼吸系统疾病中，结核性则被分类于第一章"}, {"id": "简答-165", "type": "简答题", "question": "贲门疾病按什么分类？", "answer": "在ICD 中通常对于普通疾病贲门是按食管分类的，但在肿瘤的部位编码中，贲门却是\n按胃来分类的。"}, {"id": "简答-166", "type": "简答题", "question": "疝的类目与亚目各自的分类轴心？", "answer": "类目轴心是部位，亚目轴心是并发症。腹疝，脐疝，股疝，膈疝的常见并发症是梗阻\n或坏疽，ICD-10 按其部位详细分类于K41-K44 中，在每个类目下以亚目区分并发症的情\n况。"}, {"id": "简答-167", "type": "简答题", "question": "肠血管疾患分类在第几章？", "answer": "肠血管疾患导致的肠疾病分类于消化系统，编码K55"}, {"id": "简答-168", "type": "简答题", "question": "病毒性肝炎分类在第几章？", "answer": "第一章"}, {"id": "简答-169", "type": "简答题", "question": "关节病怎么选择主导词？", "answer": "关节病是M15-M19.骨关节炎与关节病或骨关节病是同义词，在ICD-10 中没有区别，\n不同之处在于：关节病是指局限于关节的任何疾病；关节炎是局限于关节的炎症；骨关\n节病是骨和关节的任何疾病；骨关节炎是关节的退行性病变；在查找骨关节炎是，可查\n“关节病（非炎症性）”或“骨关节病”"}, {"id": "简答-170", "type": "简答题", "question": "什么是重叠综合征？如何编码？", "answer": "指重叠性结缔组织疾病，分类于M35.1，是指患者患有两种或两种以上结缔组织疾病，\n分类应以重叠综合征编码为主，再对不同疾病分别编码"}, {"id": "简答-171", "type": "简答题", "question": "主导词异常和异常的的含义，如何使用？", "answer": "“异常”表示先天性发育不正常。“异常的”表示不正常的意思，但通常不是先天性\n的。例如一些实验室或功能性检查结果不正常就要查“异常的”这个主导词。"}, {"id": "简答-172", "type": "简答题", "question": "子宫和子宫颈发育不全有两个不同的编码掌握其含义", "answer": "子宫颈的发育不全有两个不同的编码。其原因是英文的翻译无法体现其区别。发育不\n全有三个不同的英语单词，agenesis/aplasia 和hypopkasia。前者表示的程度重，是某一器官\n的缺失，常指胚胎发育时无该器官、原基出现，实际上是不发育。第二个是指器官或组织，\n或者是一个器官或组织的细胞产物发育不全，实际上是成形不全，在程度上轻于前者。第三\n个是指器官或组织发育不全或再生不良，期程度较之前两个要轻。前两个分类上没有区别，\n可同等对待。例如：先天性子宫颈缺失Q51.5 ，先天性子宫颈发育不全Q51.8 ，双宫颈\nQ51.8"}, {"id": "简答-173", "type": "简答题", "question": "新生儿肺炎P23 和P24 分类区别", "answer": "P23：先天性肺炎（感染性、先天性）P24：新生儿吸入性肺炎（非感染性）"}, {"id": "简答-174", "type": "简答题", "question": "T80-T88 手术和医疗并发症的分类在医院管理中有什么作用？", "answer": "这一节编码主要是分类一些早期的医疗并发症和不能归类到系统章的并发症，其中许\n多是属于医疗事故。因此本节的内容也应当是管理中需要加倍重视的内容。"}, {"id": "简答-175", "type": "简答题", "question": "ICPM 是谁编制的？为什么不使用？", "answer": "国际医学操作分类是世界卫生组织编制的，因为更新不及时和同一操作不能归类于一\n处，所以不使用。"}, {"id": "简答-176", "type": "简答题", "question": "CPT 是什么意思？谁编制的？作用是什么？", "answer": "CPT 是最新操作术语，是美国医学会编制的，它的目的是为第三方付款（医疗保险）\n提供一个标准的术语，一个一致的，可比较的编码方案。"}, {"id": "简答-177", "type": "简答题", "question": "遇到另编码指示是，选择哪个编码为主要编码？", "answer": "选择主要的手术操作码为主要编码，另编码为附加编码。"}, {"id": "简答-178", "type": "简答题", "question": "简述主导词确定的三个方法？", "answer": "①一般以手术的术式和操作方法为主导词。②以全名称直接查找。③以人命名的手术\n可以直接查人名，也可以查手术方法，部分还可以直接以手术为主导词查找。"}, {"id": "简答-179", "type": "简答题", "question": "恶性肿瘤切除术的假定编码？", "answer": "假定分类，对于肿瘤，如果切除方式有多种，而且工程师没有指出具体是哪一种时，\n将假定为“病损切除术”进行编码。"}, {"id": "简答-180", "type": "简答题", "question": "“肺癌切除术”的术语是否恰当？为什么？", "answer": "不恰当，因为没胡指出具体的切除范围，在手术分类中，如果不指出手术范围，而且\n也无法假定其切除的情况，则按病损切除术处理。这种情况多数是不符合实际情况的。\n因此，必须详细指出实际的切除范围，否则只能遵守分类规则。"}, {"id": "简答-181", "type": "简答题", "question": "血管腔内支架类型？", "answer": "①血管腔内成型术的支架支型有：祼支架，药物涂层，药物洗脱，主导词为插入②血\n管腔内修补术的支架类型有：覆膜支架，弹簧圈，主导词是修补术和动脉瘤缝合术。"}, {"id": "简答-182", "type": "简答题", "question": "冠状动脉介入治疗编码方法？", "answer": "①冠状动脉支架植入②置入血管的支架个数③经皮冠状动脉腔内血管成形术④治疗血\n管的数量⑤分支血管的治疗⑥冠状动脉造影⑦冠状动脉内血栓溶解剂输注⑧经管腔冠状动\n脉粥样硬化切除术"}, {"id": "简答-183", "type": "简答题", "question": "非冠状动脉介入治疗编码方法？", "answer": "①支架置入\n②植入支架的个数\n③经皮血管内血管成形术\n④治疗血管的数量\n⑤溶栓药物注射或输注\n⑥血管粥样硬化切除术"}, {"id": "简答-184", "type": "简答题", "question": "食管、胃、肠切除术的编码要注意什么？", "answer": "①明确具体切除范围：病损、部分、全部切除\n②明确手术入路：开放入路，闭合入路（内镜下），腹腔镜\n③明确重建方式：间置术是管腔常用的重建方式。"}, {"id": "简答-185", "type": "简答题", "question": "皮肤的清创术有几类？怎样区分？", "answer": "皮肤的清创术分二类，86.22 指切除性清创，去除坏死的皮肤或感染的皮肤。86.28\n指非切除性清创，以冲洗伤口为主。主导词都是清创术。"}, {"id": "简答-186", "type": "简答题", "question": "手术名称卵巢根治术缺少的是什么，如何编码？", "answer": "缺少手术切除范围"}, {"id": "简答-187", "type": "简答题", "question": "女性去势术常用于？", "answer": "乳腺癌术后预防性治疗"}, {"id": "简答-188", "type": "简答题", "question": "根治性前列腺切除术分入路吗？", "answer": "不区分"}, {"id": "简答-189", "type": "简答题", "question": "如何判断肿瘤的性质？所有带有“瘤”字的疾病名称都是肿瘤吗？", "answer": "有的称之为“瘤”的并不是肿瘤，如：动脉瘤，胆脂瘤等；有的称之为“瘤”的肿瘤也不\n是良性的，如：淋巴瘤，浆细胞骨髓瘤都是恶性的肿瘤；有的没有“瘤”“癌”“肉瘤”字\n样的反而是肿瘤，如：真性红细胞增多症，顽固性贫血都是交界恶性的肿瘤。"}, {"id": "简答-190", "type": "简答题", "question": "疾病诊断在患者出院仍不能作出肯定诊断时，有哪些处理方式？", "answer": "答：有两种处理方式：1，只有一个怀疑诊断，这里要假定为实际情况编码。2，当某\n一个症状或体征后，跟随一个或多个怀疑诊断时，只编码症状，怀疑诊断可视情况编码或不\n予编码。"}, {"id": "简答-191", "type": "简答题", "question": "广义的手术操作分类的定义。", "answer": "答：对患者直接施行的诊断性及治疗性操作，包括传统意义的外科手术、内科非手术\n性诊断和治疗性操作、实验室检查及少量对标本诊断性操作的分类。"}, {"id": "简答-192", "type": "简答题", "question": "传染与感染有什么区别？", "answer": "（1）传染和感染在中文的含义中很容易区分，前者为可传播性，后者通常指不可传播性，\n局限性，但当特指为某种微生物的感染时，也有相当一部分是传染性的。如：HIV 感\n染,这时感染又是可传播性的了。\n（2）传染和感染在英语中又都是Infection ，其含义为微生物侵犯人体组织并在其中繁殖。\n（3）不管是传染还是感染，都要以“感染”为主导词来查找。“传染”不能作为主导\n词，传染性口角炎可以直接查找。\n（4）对于寄生虫的感染要以“侵染”为主导词查找，在感染下也可以查找，但不如侵染\n的主导词直接、简便。"}, {"id": "简答-193", "type": "简答题", "question": "当临床诊断为粟粒性肺结核时，该如何编码？", "answer": "当诊断为粟粒性肺结核，没有急慢性的修饰词就无法编码，利用编码原则的第二\n条，没有指出传染病的急慢性情况，要按急性编码，编码于A19 . 0 。"}, {"id": "简答-255", "type": "简答题", "question": "请描述ICD-10 与ICD-9-CM-3 的类目、亚目、细目的区别点和共同点。", "answer": "区别点：1.表现形式以及位数不同"}, {"id": "简答-2", "type": "简答题", "question": "细目不是选择性编码必须使用", "answer": ""}, {"id": "简答-3", "type": "简答题", "question": "细目获取方法不同", "answer": "相同点：编码级别规则"}, {"id": "简答-256", "type": "简答题", "question": "详细描述ICD-10 与ICD-9-CM-3 索引排列方法。", "answer": "ICD-10 与ICD-9-CM-3 编排列方法基本一致排列\n原则一：\n分层的标准从属和修饰关系\n分层的标准"}, {"id": "简答-1", "type": "简答题", "question": "首先主导词", "answer": ""}, {"id": "简答-2", "type": "简答题", "question": "以“-” 为标准（一级）", "answer": ""}, {"id": "简答-3", "type": "简答题", "question": "每一“-” 代表上一级内容", "answer": "从属和修饰关系"}, {"id": "简答-1", "type": "简答题", "question": "主导词之间没有从属和修饰关系", "answer": ""}, {"id": "简答-2", "type": "简答题", "question": "同级没有从属和修饰关系", "answer": ""}, {"id": "简答-3", "type": "简答题", "question": "同级各下属的有从属和修饰关系", "answer": "原则二：\n一般排列方法：按汉语拼音—英文字母顺序\n特殊排列情况：数字、符号、程度、希腊字母不按英文字母顺序排列，排列英文字母前\n面。\nICD-9-CM-3 编排列方法基本与ICD-10 一致但英文开始手术名称有交叉索引并排在该\n字母前面，编码在英文手术名称。"}, {"id": "查码-1", "type": "查码题", "question": "急性风湿性全心炎", "answer": "I01.8", "detail": "急性风湿性全心炎\n查：全心炎-风湿性--活动性或急性\nI01.8"}, {"id": "查码-2", "type": "查码题", "question": "随后性前侧壁急性心肌梗死", "answer": "I22.0", "detail": "随后性前侧壁急性心肌梗死\n主导词：梗死，梗塞-心肌--随后性---前\nI22.0"}, {"id": "查码-3", "type": "查码题", "question": "新生儿创伤性青光眼", "answer": "P15.3", "detail": "新生儿创伤性青光眼\n主导词：青光眼-创伤性--新生儿P15.3"}, {"id": "查码-4", "type": "查码题", "questi
