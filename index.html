const LETTERS = 'ABCDEFGHIJ'.split('');
const TYPE_LABELS = {
  '填空题': '填空', '选择题': '选择', '判断题': '判断',
  '简答题': '简答', '查码题': '查码', '主要诊断选择题': '主要诊断',
};

// ===== State =====
let currentType = '全部';
let userAnswers = {};
let checkedState = {};
let revealedAnswers = new Set();
let wrongQuestions = loadWrong();

// ===== Persistence =====
function loadWrong() {
  try { return new Set(JSON.parse(localStorage.getItem('wq')||'[]')); }
  catch { return new Set(); }
}
function saveWrong() { localStorage.setItem('wq', JSON.stringify([...wrongQuestions])); }

function addWrong(id) { wrongQuestions.add(id); saveWrong(); updateWrongUI(); }
function removeWrong(id) { wrongQuestions.delete(id); saveWrong(); if (currentType==='错题本') renderQ(); updateWrongUI(); }
function isWrong(id) { return wrongQuestions.has(id); }

// ===== Resume Progress =====
function saveProgress() {
  const state = { type: currentType };
  const cards = document.querySelectorAll('.q-card');
  for (const c of cards) {
    const rect = c.getBoundingClientRect();
    if (rect.top >= -50 && rect.top < window.innerHeight * 0.6) {
      state.topId = c.dataset.id;
      break;
    }
  }
  state.scrollY = window.scrollY;
  localStorage.setItem('quiz_progress', JSON.stringify(state));
}

function loadProgress() {
  try { return JSON.parse(localStorage.getItem('quiz_progress') || '{}'); }
  catch { return {}; }
}

function clearProgress() { localStorage.removeItem('quiz_progress'); }

function autoResume() {
  const saved = loadProgress();
  if (!saved.type || saved.type === '全部') return;
  // Only auto-resume if there's a non-default saved position
  if (!saved.topId && !saved.scrollY) return;
  currentType = saved.type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.type === currentType));
  renderQ();
  setTimeout(() => {
    if (saved.topId) {
      const el = document.querySelector(`[data-id="${saved.topId}"]`);
      if (el) { el.scrollIntoView({ block: 'center' }); return; }
    }
    if (saved.scrollY) window.scrollTo(0, saved.scrollY);
  }, 50);
  // Show a toast
  const toast = document.createElement('div');
  toast.className = 'resume-toast';
  toast.textContent = `📌 已回到 ${TYPE_LABELS[saved.type] || saved.type} 上次位置`;
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 2500);
}
function updateWrongUI() {
  const el = document.getElementById('wrong-count');
  if (el) el.textContent = wrongQuestions.size;
  const st = document.getElementById('wrong-stat');
  if (st) st.style.display = wrongQuestions.size > 0 ? 'inline' : 'none';
  const fb = document.querySelector('.filter-btn.wrong-filter .cnt');
  if (fb) fb.textContent = wrongQuestions.size;
}

// ===== Mode Switching =====
function switchMode(mode) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('practice-mode').classList.toggle('active', mode === 'practice');
  document.getElementById('practice-header').style.display = mode === 'practice' ? 'block' : 'none';
  document.getElementById('exam-setup').classList.toggle('active', mode === 'exam');
  document.getElementById('exam-mode').classList.remove('active');
  document.getElementById('exam-results').classList.remove('active');
  if (mode === 'practice') renderQ();
}

// ===== Filter =====
function buildFilter() {
  const counts = { '全部': QUESTIONS.length };
  QUESTIONS.forEach(q => { counts[q.type] = (counts[q.type]||0) + 1; });
  const frag = document.createDocumentFragment();
  for (const [type, cnt] of Object.entries(counts)) {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (type===currentType?' active':'');
    btn.innerHTML = `${TYPE_LABELS[type]||type} <span class="cnt">${cnt}</span>`;
    btn.dataset.type = type;
    btn.onclick = () => { currentType=type; document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===currentType)); renderQ(); saveProgress(); };
    frag.appendChild(btn);
  }
  const wb = document.createElement('button');
  wb.className = 'filter-btn wrong-filter' + (currentType==='错题本'?' active':'');
  wb.innerHTML = `错题本 <span class="cnt">${wrongQuestions.size}</span>`;
  wb.dataset.type = '错题本';
  wb.onclick = () => { currentType='错题本'; document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===currentType)); renderQ(); saveProgress(); };
  frag.appendChild(wb);
  document.getElementById('filter-bar').appendChild(frag);
}

function getFiltered() {
  if (currentType==='错题本') return QUESTIONS.filter(q => wrongQuestions.has(q.id));
  return currentType==='全部' ? QUESTIONS : QUESTIONS.filter(q => q.type === currentType);
}

// ===== Render Questions (Practice) =====
function renderQ() {
  const list = document.getElementById('q-list');
  const filtered = getFiltered();
  if (filtered.length===0) { list.innerHTML='<div class="empty">📭 没有找到题目</div>'; document.getElementById('stats-text').textContent=''; return; }
  const frag = document.createDocumentFragment();
  filtered.forEach(q => frag.appendChild(createCard(q)));
  list.innerHTML = '';
  list.appendChild(frag);

  const total = filtered.length;
  const done = filtered.filter(q => checkedState[q.id]==='correct').length;
  const wrong = filtered.filter(q => isWrong(q.id)).length;
  let txt = `📄 共 ${total} 题  ·  ✅ ${done} 题`;
  if (currentType!=='错题本' && wrong>0) txt += `  ·  ❌ ${wrong} 题`;
  document.getElementById('stats-text').textContent = txt;
}

// ===== Create Question Card (shared) =====
function createCard(q) {
  const div = document.createElement('div');
  div.className = 'q-card' + (isWrong(q.id)?' is-wrong':'') + (checkedState[q.id]==='correct'?' is-correct':'');
  div.dataset.id = q.id;

  const hd = document.createElement('div');
  hd.className = 'q-hd';
  hd.innerHTML = `<span class="id">#${q.id}</span><span class="badge">${TYPE_LABELS[q.type]||q.type}</span>`;
  if (isWrong(q.id)) { const t=document.createElement('span'); t.className='wrong-tag'; t.textContent='错题'; hd.appendChild(t); }
  div.appendChild(hd);

  const qt = document.createElement('div'); qt.className = 'q-text'; div.appendChild(qt);
  const ia = document.createElement('div'); div.appendChild(ia);
  const fb = document.createElement('div'); fb.className = 'fb'; div.appendChild(fb);
  const rv = document.createElement('div'); rv.className = 'reveal'; div.appendChild(rv);

  switch (q.type) {
    case '填空题': renderFill(q,qt,ia,fb,rv); break;
    case '选择题': renderChoice(q,qt,ia,fb,rv); break;
    case '判断题': renderJudge(q,qt,ia,fb,rv); break;
    case '简答题': renderText(q,qt,ia,fb,rv); break;
    case '查码题': renderCode(q,qt,ia,fb,rv); break;
    case '主要诊断选择题': renderMainDiag(q,qt,ia,fb,rv); break;
    default: qt.textContent=q.question; renderText(q,qt,ia,fb,rv);
  }
  return div;
}

// ===== 填空题 =====
function renderFill(q,qt,ia,fb,rv) {
  const parts = q.question.split('（____）');
  if (parts.length>1) {
    const frag = document.createDocumentFragment();
    parts.forEach((p,i) => {
      frag.appendChild(document.createTextNode(p));
      if (i<parts.length-1) {
        const inp = document.createElement('input');
        inp.type='text'; inp.className='blank'; inp.placeholder='答案';
        if (userAnswers[q.id]) inp.value=userAnswers[q.id];
        inp.oninput = () => { userAnswers[q.id]=inp.value; checkedState[q.id]=null; inp.classList.remove('correct','wrong'); fb.classList.remove('show'); };
        frag.appendChild(inp);
      }
    });
    qt.appendChild(frag);
  } else { qt.textContent = q.question; }

  const ac = document.createElement('div'); ac.className='q-actions';
  const ck = document.createElement('button'); ck.className='btn btn-pri'; ck.textContent='检查';
  ck.onclick = () => {
    const inp = qt.querySelector('.blank');
    if (!inp||!inp.value.trim()) { showFb(fb,'请先输入答案','info'); return; }
    const ok = q.answers.some(a => a===inp.value.trim());
    checkedState[q.id] = ok?'correct':'wrong';
    inp.classList.add(ok?'correct':'wrong');
    showFb(fb, ok?'✅ 正确！':'❌ 不正确，看看正确答案吧', ok?'correct':'wrong');
    if (!ok) addWrong(q.id);
  };
  ac.appendChild(ck);
  ac.appendChild(rvBtn(q,rv));
  addRmBtn(ac,q);
  ia.appendChild(ac);
  buildRv(q,rv);

  if (checkedState[q.id]) {
    const inp = qt.querySelector('.blank');
    if (inp) { inp.classList.add(checkedState[q.id]); showFb(fb, checkedState[q.id]==='correct'?'✅ 正确！':'❌ 不正确', checkedState[q.id]); }
  }
}

// ===== 选择题 =====
function renderChoice(q,qt,ia,fb,rv) {
  qt.textContent = q.question;
  const ra = (q.answer||'').trim();
  const multi = ra.length > 1;
  const hasOpts = q.options && q.options.length>0;
  const hasAns = ra.length > 0;

  const od = document.createElement('div'); od.className='opts';
  if (!hasOpts) {
    const m = document.createElement('div'); m.style.cssText='color:var(--text3);font-size:13px;padding:8px 0;';
    m.textContent='（本题未提供选项）'; od.appendChild(m);
  } else {
    q.options.forEach((txt,i) => {
      const l = LETTERS[i];
      const it = document.createElement('div'); it.className='opt';
      it.innerHTML = `<span class="letter">${l}</span><span>${txt}</span>`;
      if (multi && hasAns) {
        it.onclick = () => {
          it.classList.toggle('sel');
          checkedState[q.id]=null; fb.classList.remove('show');
          od.querySelectorAll('.opt').forEach(el => { el.style.borderColor=''; el.className='opt'+(el.classList.contains('sel')?' sel':''); });
        };
      } else {
        it.onclick = () => {
          od.querySelectorAll('.opt').forEach(el => { el.className='opt'; el.style.borderColor=''; });
          it.classList.add('sel');
          userAnswers[q.id]=l; checkedState[q.id]=null; fb.classList.remove('show');
          checkChoice(q,l,fb,od);
        };
      }
      od.appendChild(it);
    });
  }
  ia.appendChild(od);

  const ac = document.createElement('div'); ac.className='q-actions';
  if (multi && hasOpts && hasAns) {
    const sb = document.createElement('button'); sb.className='btn btn-pri'; sb.textContent='提交答案';
    sb.onclick = () => {
      const sel = [...od.querySelectorAll('.opt.sel')].map(el => el.querySelector('.letter').textContent);
      checkChoice(q,sel.join(''),fb,od);
    };
    ac.appendChild(sb);
  }
  ac.appendChild(rvBtn(q,rv));
  addRmBtn(ac,q);
  ia.appendChild(ac);

  buildRv(q,rv);
  if (hasOpts && hasAns) {
    const txt = [...ra].map(l => { const i=LETTERS.indexOf(l); return i!==-1&&q.options[i]?`${l}. ${q.options[i]}`:l; }).join('；');
    const cd = rv.querySelector('.rc');
    if (cd) cd.innerHTML = `<code>${txt}</code>`;
  }
  if (!hasAns) { const cd=rv.querySelector('.rc'); if(cd) cd.innerHTML='<span style="color:var(--text3)">本题未设置正确答案</span>'; }
}

function checkChoice(q,sel,fb,od) {
  const correct = (q.answer||'').trim();
  if (!correct) { showFb(fb,'本题未设置正确答案','info'); return; }
  const sort = s => [...s].sort().join('');
  const ok = sort(sel)===sort(correct);
  checkedState[q.id] = ok?'correct':'wrong';
  if (!ok) addWrong(q.id);

  if (od) {
    od.querySelectorAll('.opt').forEach((it,i) => {
      const l = LETTERS[i];
      it.className = 'opt'+(it.classList.contains('sel')?' sel':'');
      it.style.borderColor = '';
      if (correct.includes(l)) { it.classList.add('correct'); }
      if (sel.includes(l) && !correct.includes(l)) { it.classList.add('wrong'); }
    });
  }
  showFb(fb, ok?'✅ 正确！':`❌ 回答错误，正确答案是 ${[...correct].join('、')}`, ok?'correct':'wrong');
}

// ===== 判断题 =====
function renderJudge(q,qt,ia,fb,rv) {
  qt.textContent = q.question;
  const g = document.createElement('div'); g.className='judge-group';
  const tb = document.createElement('button'); tb.className='judge-btn'; tb.textContent='✓ 正确';
  tb.onclick = () => { g.querySelectorAll('.judge-btn').forEach(b=>b.className='judge-btn'); tb.classList.add('sel-true'); checkJudge(q,'正确',fb); };
  const fb2 = document.createElement('button'); fb2.className='judge-btn'; fb2.textContent='✗ 错误';
  fb2.onclick = () => { g.querySelectorAll('.judge-btn').forEach(b=>b.className='judge-btn'); fb2.classList.add('sel-false'); checkJudge(q,'错误',fb); };
  g.appendChild(tb); g.appendChild(fb2); ia.appendChild(g);
  const ac = document.createElement('div'); ac.className='q-actions';
  ac.appendChild(rvBtn(q,rv)); addRmBtn(ac,q); ia.appendChild(ac);
  buildRv(q,rv);
}

function checkJudge(q,sel,fb) {
  const ok = sel === q.answer;
  checkedState[q.id] = ok?'correct':'wrong';
  showFb(fb, ok?'✅ 正确！':'❌ 回答错误', ok?'correct':'wrong');
  if (!ok) addWrong(q.id);
}

// ===== 简答题 =====
function renderText(q,qt,ia,fb,rv) {
  qt.textContent = q.question;
  const ta = document.createElement('textarea'); ta.className='txt-inp'; ta.rows=3; ta.placeholder='输入你的答案...';
  if (userAnswers[q.id]) ta.value=userAnswers[q.id];
  ta.oninput = () => { userAnswers[q.id]=ta.value; };
  ia.appendChild(ta);
  const ac = document.createElement('div'); ac.className='q-actions';
  ac.appendChild(rvBtn(q,rv)); addRmBtn(ac,q); ia.appendChild(ac);
  buildRv(q,rv);
}

// ===== 查码题 =====
function renderCode(q,qt,ia,fb,rv) {
  qt.textContent = q.question;
  const inp = document.createElement('input'); inp.type='text'; inp.className='txt-inp'; inp.style.maxWidth='200px'; inp.placeholder='输入 ICD 编码...';
  if (userAnswers[q.id]) inp.value=userAnswers[q.id];
  inp.oninput = () => { userAnswers[q.id]=inp.value; };
  ia.appendChild(inp);
  const ac = document.createElement('div'); ac.className='q-actions';
  const ck = document.createElement('button'); ck.className='btn btn-pri'; ck.textContent='检查';
  ck.onclick = () => {
    if (!inp.value.trim()) { showFb(fb,'请输入编码','info'); return; }
    const ok = inp.value.trim().toUpperCase() === q.answer.toUpperCase();
    checkedState[q.id] = ok?'correct':'wrong';
    showFb(fb, ok?`✅ 编码正确！`:`❌ 不正确，正确答案是 ${q.answer}`, ok?'correct':'wrong');
    if (!ok) addWrong(q.id);
  };
  ac.appendChild(ck);
  ac.appendChild(rvBtn(q,rv)); addRmBtn(ac,q); ia.appendChild(ac);
  buildRv(q,rv);
}

// ===== 主要诊断选择题 =====
function renderMainDiag(q,qt,ia,fb,rv) {
  qt.textContent = q.question;
  const ta = document.createElement('textarea'); ta.className='txt-inp'; ta.rows=3; ta.placeholder='输入主要诊断及编码...';
  if (userAnswers[q.id]) ta.value=userAnswers[q.id];
  ta.oninput = () => { userAnswers[q.id]=ta.value; };
  ia.appendChild(ta);
  const ac = document.createElement('div'); ac.className='q-actions';
  ac.appendChild(rvBtn(q,rv)); addRmBtn(ac,q); ia.appendChild(ac);
  buildRv(q,rv);
}

// ===== Shared helpers =====
function rvBtn(q,rv) {
  const b = document.createElement('button'); b.className='btn btn-out'; b.textContent='查看答案';
  b.onclick = () => {
    const s = rv.classList.toggle('show');
    b.textContent = s?'隐藏答案':'查看答案';
  };
  return b;
}

function buildRv(q,rv) {
  let h = '<div class="rl">正确答案</div><div class="rc"><code>'+esc(q.answer)+'</code></div>';
  if (q.detail) h += '<div class="detail">'+esc(q.detail)+'</div>';
  rv.innerHTML = h;
}

function addRmBtn(ac,q) {
  if (!isWrong(q.id)) return;
  const b = document.createElement('button'); b.className='btn btn-del'; b.textContent='移出错题本';
  b.onclick = () => {
    removeWrong(q.id); b.remove();
    const card = b.closest('.q-card');
    if (card) { card.classList.remove('is-wrong'); const t=card.querySelector('.wrong-tag'); if(t)t.remove(); }
  };
  ac.appendChild(b);
}

function showFb(el,msg,type) {
  el.className = 'fb show '+type;
  el.innerHTML = msg;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s; return d.innerHTML;
}

// =============================================
//   EXAM MODE
// =============================================
let examState = {
  questions: [],
  answers: {},
  index: 0,
  startTime: null,
  timerInterval: null,
  submitted: false,
  total: 0,
};

function selectExamCount(el,n) {
  document.querySelectorAll('.setup-opt').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
}

function startExam() {
  const sel = document.querySelector('.setup-opt.sel');
  const n = parseInt(sel ? sel.dataset.n : 20);

  // Randomly select questions, mixing all types
  const shuffled = [...QUESTIONS].sort(() => Math.random()-0.5);
  const picked = shuffled.slice(0, Math.min(n, QUESTIONS.length));

  examState.questions = picked;
  examState.answers = {};
  examState.index = 0;
  examState.startTime = Date.now();
  examState.submitted = false;
  examState.total = picked.length;

  document.getElementById('exam-setup').classList.remove('active');
  document.getElementById('exam-mode').classList.add('active');

  if (examState.timerInterval) clearInterval(examState.timerInterval);
  examState.timerInterval = setInterval(updateTimer, 1000);
  updateTimer();

  renderExamQuestion();
  renderExamPalette();
  updateExamProgress();
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - examState.startTime) / 1000);
  const m = String(Math.floor(elapsed/60)).padStart(2,'0');
  const s = String(elapsed%60).padStart(2,'0');
  const el2 = document.getElementById('exam-timer');
  el2.textContent = m+':'+s;
  // Warn if over 60 minutes
  if (elapsed > 3600) el2.classList.add('warn');
}

function renderExamQuestion() {
  const main = document.getElementById('exam-main');
  const q = examState.questions[examState.index];
  if (!q) { main.innerHTML = '<div class="empty">题目加载失败</div>'; return; }

  // Save current answer
  const curAns = examState.answers[q.id];

  const card = createCard(q);

  // Restore exam answer state
  if (curAns !== undefined && curAns !== '') {
    // For choice questions
    const opts = card.querySelectorAll('.opt');
    if (opts.length > 0) {
      const letters = [...curAns];
      opts.forEach(o => {
        const l = o.querySelector('.letter').textContent;
        if (letters.includes(l)) o.classList.add('sel');
      });
    }
    // For fill-in / text inputs
    const inp = card.querySelector('.blank, .txt-inp');
    if (inp) inp.value = curAns;
    // For judge
    const judgeBtns = card.querySelectorAll('.judge-btn');
    if (judgeBtns.length > 0) {
      if (curAns === '正确') { judgeBtns[0].classList.add('sel-true'); }
      if (curAns === '错误') { judgeBtns[1].classList.add('sel-false'); }
    }
  }

  // Override feedback to save exam answers
  // We need to intercept the various input handlers
  card.querySelectorAll('.blank, .txt-inp').forEach(el => {
    const orig = el.oninput;
    el.oninput = () => {
      if (orig) orig();
      examState.answers[q.id] = el.value;
      renderExamPalette();
    };
  });
  card.querySelectorAll('.opt').forEach(el => {
    const orig = el.onclick;
    el.onclick = () => {
      const ra = (q.answer||'').trim();
      const multi = ra.length > 1;
      if (orig) {
        // For single choice, orig handles everything
        if (!multi) { orig(); examState.answers[q.id] = [...card.querySelectorAll('.opt.sel')].map(o=>o.querySelector('.letter').textContent).join(''); renderExamPalette(); return; }
        // For multi, toggle
        el.classList.toggle('sel');
        checkedState[q.id]=null;
        card.querySelector('.fb').classList.remove('show');
        card.querySelectorAll('.opt').forEach(o => { o.style.borderColor=''; o.className='opt'+(o.classList.contains('sel')?' sel':''); });
      }
      examState.answers[q.id] = [...card.querySelectorAll('.opt.sel')].map(o=>o.querySelector('.letter').textContent).join('');
      renderExamPalette();
    };
  });
  card.querySelectorAll('.judge-btn').forEach(el => {
    el.onclick = () => {
      card.querySelectorAll('.judge-btn').forEach(b=>b.className='judge-btn');
      el.classList.add(el.textContent.includes('正确')?'sel-true':'sel-false');
      examState.answers[q.id] = el.textContent.includes('正确')?'正确':'错误';
      renderExamPalette();
    };
  });
  // Hide reveal btn in exam mode
  const rvBtn2 = card.querySelector('.btn-out');
  if (rvBtn2) rvBtn2.style.display = 'none';
  // Hide remove wrong btn
  const rmBtn = card.querySelector('.btn-del');
  if (rmBtn) rmBtn.style.display = 'none';
  // Disable checking
  const ckBtn = card.querySelector('.btn-pri');
  if (ckBtn) ckBtn.style.display = 'none';

  main.innerHTML = '';
  main.appendChild(card);
}

function renderExamPalette() {
  const el = document.getElementById('exam-palette');
  el.innerHTML = '';
  examState.questions.forEach((q,i) => {
    const b = document.createElement('button');
    b.className = 'palette-btn';
    if (i === examState.index) b.classList.add('current');
    if (examState.answers[q.id] && examState.answers[q.id].trim() !== '') b.classList.add('answered');
    b.textContent = i+1;
    b.onclick = () => { examState.index=i; renderExamQuestion(); renderExamPalette(); updateExamProgress(); };
    el.appendChild(b);
  });
}

function updateExamProgress() {
  const total = examState.total;
  const cur = examState.index+1;
  document.getElementById('exam-pstat').textContent = `${cur}/${total}`;
  document.getElementById('exam-bar').style.width = `${(cur/total)*100}%`;
  document.getElementById('exam-prev').disabled = examState.index === 0;
  document.getElementById('exam-next').disabled = examState.index === total-1;
}

function examPrev() {
  if (examState.index > 0) { examState.index--; renderExamQuestion(); renderExamPalette(); updateExamProgress(); }
}
function examNext() {
  if (examState.index < examState.total-1) { examState.index++; renderExamQuestion(); renderExamPalette(); updateExamProgress(); }
}

function examSubmit() {
  if (examState.submitted) return;
  if (!confirm('确定要交卷吗？\n已答 ' + Object.keys(examState.answers).length + '/' + examState.total + ' 题')) return;
  examState.submitted = true;
  if (examState.timerInterval) clearInterval(examState.timerInterval);

  // Calculate score
  let correct = 0;
  let wrong = 0;
  const details = [];

  examState.questions.forEach(q => {
    const userAns = examState.answers[q.id] || '';
    const correctAns = (q.answer||'').trim();

    let isCorrect = false;
    if (q.type === '选择题') {
      if (correctAns) {
        isCorrect = [...userAns].sort().join('') === [...correctAns].sort().join('');
      } else {
        isCorrect = false;
      }
    } else if (q.type === '判断题' || q.type === '填空题') {
      isCorrect = userAns === correctAns;
    } else {
      // 简答/查码/主要诊断: check exact match or uppercase match
      if (q.type === '查码题') {
        isCorrect = userAns.toUpperCase() === correctAns.toUpperCase();
      } else {
        isCorrect = userAns.trim() !== ''; // Just count as attempted
      }
    }

    if (isCorrect) correct++; else wrong++;
    details.push({ q, userAns, isCorrect });
  });

  const total = examState.total;
  const score = Math.round((correct/total)*100);
  const elapsed = Math.floor((Date.now() - examState.startTime) / 1000);
  const timeStr = String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0');

  // Show results
  document.getElementById('exam-mode').classList.remove('active');
  const rc = document.getElementById('result-card');
  rc.innerHTML = `
    <div class="big-score ${score>=60?'pass':'fail'}">${score}</div>
    <div class="score-label">得分</div>
    <div class="score-detail">
      <div class="s-item"><div class="s-num">${correct}</div><div class="s-label">正确</div></div>
      <div class="s-item"><div class="s-num">${wrong}</div><div class="s-label">错误</div></div>
      <div class="s-item"><div class="s-num">${total}</div><div class="s-label">总题数</div></div>
      <div class="s-item"><div class="s-num">${timeStr}</div><div class="s-label">用时</div></div>
    </div>
    <div class="result-actions">
      <button class="btn btn-pri" onclick="examReview()">查看答案</button>
      <button class="btn btn-out" onclick="switchMode('practice')">返回练习</button>
    </div>
  `;

  // Build review list
  const rl = document.getElementById('review-list');
  rl.innerHTML = '<h3 style="margin:16px 0 12px;font-size:16px">📋 答题详情</h3>';
  const frag = document.createDocumentFragment();
  details.forEach((d,i) => {
    const div = document.createElement('div');
    div.className = `review-item ${d.isCorrect?'is-correct':'is-wrong'}`;
    const typeLabel = TYPE_LABELS[d.q.type] || d.q.type;
    div.innerHTML = `
      <div class="ri-hd">
        <span class="ri-icon">${d.isCorrect?'✅':'❌'}</span>
        <span class="ri-id">#${d.q.id}</span>
        <span class="ri-badge">${typeLabel}</span>
      </div>
      <div class="ri-q">${esc(d.q.question)}</div>
      <div class="ri-ans">
        <span class="ri-label">你的答案：</span><span class="ri-yours">${esc(d.userAns||'（未作答）')}</span>
        &nbsp;&nbsp;
        <span class="ri-label">正确答案：</span><span class="ri-correct">${esc(d.q.answer)}</span>
      </div>
    `;
    if (d.q.detail) {
      const dt = document.createElement('div');
      dt.style.cssText='margin-top:8px;padding:8px;background:#f8fafc;border-radius:6px;font-size:13px;color:var(--text2);white-space:pre-wrap';
      dt.textContent = d.q.detail;
      div.appendChild(dt);
    }
    frag.appendChild(div);
  });
  rl.appendChild(frag);

  document.getElementById('exam-results').classList.add('active');
}

function examReview() {
  document.getElementById('exam-results').classList.remove('active');
  document.getElementById('exam-mode').classList.add('active');
  // In review mode, show answers
  examState.index = 0;
  renderExamQuestion();
  renderExamPalette();
  updateExamProgress();
  // Show all reveals
  document.querySelectorAll('#exam-mode .reveal').forEach(el => el.classList.add('show'));
}

// ===== Init =====
document.getElementById('total-count').textContent = QUESTIONS.length;
buildFilter();
renderQ();
updateWrongUI();
autoResume();
// Save progress periodically on scroll
let _st = null;
window.addEventListener('scroll', () => {
  if (_st) clearTimeout(_st);
  _st = setTimeout(saveProgress, 500);
});
</script>
